name: Ligações das lojas (FOXNET)

# Monta a lista de ligações de cada loja no FOXNET e reconfere quem comprou
# ou agendou. As planilhas do Google (Apps Script) continuam funcionando igual.
on:
  schedule:
    # Todos os dias (inclusive sábado e domingo), horário de Porto Velho (UTC−4):
    #   7h, 10h, 15h e 18h (decisão do TI, 22/11/2026)
    #   7h: entra a lista das cotações de ontem (se o Analytics já atualizou);
    #   toda rodada reconfere quem comprou (Movere) e quem agendou no Kommo e
    #   divide os clientes novos entre os vendedores de cada loja.
    #   Se der erro (ou às 18h o dia anterior ainda faltar), a rodada falha e o
    #   GitHub manda e-mail.
    - cron: '0 11,14,19,22 * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só mostrar o que faria, sem gravar nada'
        type: boolean
        default: false

concurrency:
  group: ligacoes-lojas
  cancel-in-progress: false

jobs:
  ligacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install httpx

      - name: Montar a lista de ligações
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANALYTICS_LOGIN: ${{ secrets.ANALYTICS_LOGIN }}
          ANALYTICS_SENHA: ${{ secrets.ANALYTICS_SENHA }}
          KOMMO_TOKEN: ${{ secrets.KOMMO_TOKEN }}
          DRY_RUN: ${{ inputs.teste && '1' || '' }}
        run: python ligacoes_lojas.py
