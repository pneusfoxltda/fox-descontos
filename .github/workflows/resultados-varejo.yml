name: Resultados Varejo (rotina 553)

# Grava o "Resultado Varejo - Geral" da página /resultados: rotina 553 do Movere, loja por loja.
# De dia (acordado pelo sync-televendas às 7h45, 10h45, 13h45, 15h45 e 17h45, seg–sáb) só o "hoje" das 8 lojas.
# Às 19h10 (cron abaixo) o COMPLETO: mês + pneus + conferência com o Analytics (a setinha vermelha).
# Se o retrato do mês ficou velho (a rodada das 19h não aconteceu), a próxima rodada faz o completo sozinha.
on:
  schedule:
    - cron: '10 23 * * 1-6'
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só mostrar o que faria, sem gravar nada'
        type: boolean
        default: false
      modo:
        description: 'automatico (pelo horário), hoje (só o dia) ou completo (mês + pneus + conferência)'
        type: choice
        options: [automatico, hoje, completo]
        default: automatico

concurrency:
  group: movere-553   # o mesmo do Atacado: um espera o outro (mesmo login do Movere)
  cancel-in-progress: false

jobs:
  varejo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install playwright beautifulsoup4 httpx holidays cryptography
          playwright install --with-deps chromium

      - name: Rotina 553 → banco
        env:
          MOVERE_USER: ${{ secrets.MOVERE_USER }}
          MOVERE_PASS: ${{ secrets.MOVERE_PASS }}
          ANALYTICS_LOGIN: ${{ secrets.ANALYTICS_LOGIN }}
          ANALYTICS_SENHA: ${{ secrets.ANALYTICS_SENHA }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.teste && '1' || '' }}
          MODO: ${{ inputs.modo != 'automatico' && inputs.modo || '' }}
        run: python resultados_varejo.py
