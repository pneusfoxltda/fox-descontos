name: Sync Televendas

on:
  schedule:
    # ── Seg–Sáb 6h45–17h45 BRT (9h45–20h45 UTC) ──────────────────────────────
    # Inicia 15 min antes da hora cheia → dados prontos às 7h, 8h … 18h BRT.
    # (BRT = UTC−3; ajustar para UTC−2 durante horário de verão out–fev)
    - cron: '45 9-20 * * 1-6'

  workflow_dispatch: # permite rodar manualmente no GitHub

# Garante que apenas 1 run rode por vez.
# Se um novo trigger chegar enquanto outro está rodando, ele aguarda na fila (1 pendente).
# Triggers adicionais enquanto já há 1 pendente são descartados automaticamente pelo GitHub.
concurrency:
  group: sync-televendas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install playwright httpx beautifulsoup4
          playwright install chromium --with-deps

      - name: Rodar sync
        env:
          MOVERE_USER: ${{ secrets.MOVERE_USER }}
          MOVERE_PASS: ${{ secrets.MOVERE_PASS }}
        run: python sync_televendas.py
