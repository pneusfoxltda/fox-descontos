name: Sync Televendas

on:
  schedule:
    # ── Seg–Sáb, de hora em hora, 15 min antes da hora cheia ─────────────────
    # Porto Velho / Rondônia = UTC−4 (Horário do Amazonas, fixo)
    # Inicia: 6h45 → 7h45 → 8h45 … 17h45 AMT (Porto Velho)
    # Dados prontos às: 7h → 8h → 9h … 18h (horário local Porto Velho)
    - cron: '45 10-21 * * 1-6'

  workflow_dispatch: # permite rodar manualmente no GitHub

# Garante que apenas 1 run rode por vez.
# Se um novo trigger chegar enquanto outro está rodando, ele aguarda na fila (1 pendente).
# Triggers adicionais enquanto já há 1 pendente são descartados automaticamente pelo GitHub.
concurrency:
  group: sync-televendas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: pip install playwright httpx beautifulsoup4 holidays

      - name: Obter versão do Playwright (para chave de cache)
        id: pw-ver
        run: echo "version=$(pip show playwright | grep ^Version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache do navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-ver.outputs.version }}

      - name: Instalar Chromium (somente se não estiver em cache)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Instalar dependências do sistema (com retry se DNS falhar)
        run: |
          playwright install-deps chromium || \
          (sudo apt-get update --fix-missing -y && playwright install-deps chromium)

      - name: Rodar sync
        env:
          MOVERE_USER: ${{ secrets.MOVERE_USER }}
          MOVERE_PASS: ${{ secrets.MOVERE_PASS }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_televendas.py

      - name: Upload diagnóstico (HTML + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movere-debug
          path: |
            /tmp/movere_debug_*.html
            /tmp/movere_ss_*.png
          if-no-files-found: ignore
          retention-days: 3

  # ── Despertador dos outros robôs ────────────────────────────────────────────
  # O horário agendado do GitHub atrasa horas ou pula (em 23/11 a rodada das 7h não aconteceu).
  # Este robô é disparado de fora, em ponto, de hora em hora: ao terminar, ele acorda os outros
  # no horário certo de Porto Velho. Os horários agendados de cada robô continuam como reserva
  # (e no domingo, quando este não roda). Rodar duas vezes não estraga nada: as Ligações não
  # repetem clientes e os Avisos não mandam o mesmo aviso duas vezes no dia.
  acordar-robos:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Acordar os robôs do horário
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # A hora de quando o despertador COMEÇOU (não a de quando terminou): o Sync às vezes passa da hora cheia
          # (24/11: começou 6h45, terminou depois das 7h e o robô das Ligações das 6h45 não foi acordado).
          INICIO=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at 2>/dev/null || true)
          if [ -n "$INICIO" ]; then H=$(TZ=America/Porto_Velho date -d "$INICIO" +%-H); else H=$(TZ=America/Porto_Velho date -d '-40 min' +%-H); fi
          echo "Começou às ${INICIO:-?} · hora em Porto Velho: ${H}h"
          acordar() { echo "→ acordando $1"; gh workflow run "$1" --repo "$REPO" --ref main || echo "⚠️ não consegui acordar $1"; }
          case "$H" in
            6)  acordar ligacoes-lojas.yml ;;
            7)  acordar avisos-ligacoes.yml; acordar conferir-vendas-movere.yml ;;
            9)  acordar ligacoes-lojas.yml; acordar avisos-ligacoes.yml ;;
            12) acordar conferir-vendas-movere.yml ;;
            13) acordar avisos-ligacoes.yml ;;
            14) acordar ligacoes-lojas.yml ;;
            16) acordar avisos-ligacoes.yml ;;
            17) acordar ligacoes-lojas.yml; acordar conferir-vendas-movere.yml ;;
            *)  echo "Nenhum robô para acordar nesta hora." ;;
          esac
          # Resultados Fox Pneus · Varejo e Atacado (um espera o outro): de hora em hora, das 7h45 às 17h45 (e o próprio robô roda às 19h10)
          if [ "$H" -ge 7 ] && [ "$H" -le 17 ]; then acordar resultados-varejo.yml; acordar resultados-atacado.yml; fi
