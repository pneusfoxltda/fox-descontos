name: Sync Televendas

on:
  schedule:
    # Seg–Sáb, de hora em hora (6h45 às 17h45 horário de Porto Velho / Rondônia)
    - cron: '45 10-21 * * 1-6'

  workflow_dispatch: # permite rodar manualmente no GitHub

concurrency:
  group: sync-televendas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: pip install playwright httpx beautifulsoup4 holidays

      - name: Obter versão do Playwright (para chave de cache)
        id: pw-ver
        run: echo "version=$(pip show playwright | grep ^Version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache do navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-ver.outputs.version }}

      - name: Instalar Chromium (somente se não estiver em cache)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Instalar dependências do sistema (com retry se DNS falhar)
        run: |
          playwright install-deps chromium || \
          (sudo apt-get update --fix-missing -y && playwright install-deps chromium)

      - name: Rodar sync
        env:
          MOVERE_USER: ${{ secrets.MOVERE_USER }}
          MOVERE_PASS: ${{ secrets.MOVERE_PASS }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_televendas.py

      - name: Upload diagnóstico (HTML + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movere-debug
          path: |
            /tmp/movere_debug_*.html
            /tmp/movere_ss_*.png
          if-no-files-found: ignore
          retention-days: 3
