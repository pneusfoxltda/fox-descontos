name: Sync Televendas

on:
  schedule:
    # ── Seg–Sáb 6h46–18h11 BRT (9h46–21h11 UTC): a cada 5 min, 14 min antes ──
    - cron: '46,51,56 9 * * 1-6'                               # 6h46–6h56 BRT
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 10-20 * * 1-6' # 7h01–17h56 BRT
    - cron: '1,6,11 21 * * 1-6'                                # 18h01–18h11 BRT

    # ── Seg–Sáb 18h16–23h16 BRT: a cada 30 min, 14 min antes ──
    - cron: '16,46 21 * * 1-6'                                 # 18h16–18h46 BRT
    - cron: '16,46 22,23 * * 1-6'                              # 19h16–20h46 BRT
    - cron: '16,46 0,1 * * 0,2-6'                              # 21h16–22h46 BRT (UTC Ter–Dom)
    - cron: '16 2 * * 0,2-6'                                   # 23h16 BRT (UTC Ter–Dom)

    # ── Domingo BRT: a cada hora, 14 min antes ──
    - cron: '46 2-22 * * 0'                                    # 23h46 Sáb–19h46 Dom BRT
    - cron: '46 23 * * 0'                                      # 20h46 Dom BRT
    - cron: '46 0,1 * * 1'                                     # 21h46–22h46 Dom BRT (UTC Seg)
    - cron: '46 2 * * 1'                                       # 23h46 Dom BRT (UTC Seg)

  workflow_dispatch: # permite rodar manualmente no GitHub

# Garante que apenas 1 run rode por vez.
# Se um novo trigger chegar enquanto outro está rodando, ele aguarda na fila (1 pendente).
# Triggers adicionais enquanto já há 1 pendente são descartados automaticamente pelo GitHub.
concurrency:
  group: sync-televendas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install playwright httpx beautifulsoup4
          playwright install chromium --with-deps

      - name: Rodar sync
        env:
          MOVERE_USER: ${{ secrets.MOVERE_USER }}
          MOVERE_PASS: ${{ secrets.MOVERE_PASS }}
        run: python sync_televendas.py
