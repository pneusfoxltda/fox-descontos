name: Sync Televendas

on:
  schedule:
    # ── Seg–Sáb, de hora em hora, 15 min antes da hora cheia ─────────────────
    # Porto Velho / Rondônia = UTC−4 (Horário do Amazonas, fixo)
    # Inicia: 6h45 → 7h45 → 8h45 … 17h45 AMT (Porto Velho)
    # Dados prontos às: 7h → 8h → 9h … 18h (horário local Porto Velho)
    - cron: '45 10-21 * * 1-6'

  workflow_dispatch: # permite rodar manualmente no GitHub

# Garante que apenas 1 run rode por vez.
# Se um novo trigger chegar enquanto outro está rodando, ele aguarda na fila (1 pendente).
# Triggers adicionais enquanto já há 1 pendente são descartados automaticamente pelo GitHub.
concurrency:
  group: sync-televendas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: pip install playwright httpx beautifulsoup4 holidays

      - name: Cache do navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Instalar Chromium (somente se não estiver em cache)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Instalar dependências do sistema (com retry se DNS falhar)
        run: |
          playwright install-deps chromium || \
          (sudo apt-get update --fix-missing -y && playwright install-deps chromium)

      - name: Rodar sync
        env:
          MOVERE_USER: ${{ secrets.MOVERE_USER }}
          MOVERE_PASS: ${{ secrets.MOVERE_PASS }}
        run: python sync_televendas.py

      - name: Upload diagnóstico (HTML + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movere-debug
          path: |
            /tmp/movere_debug_*.html
            /tmp/movere_ss_*.png
          if-no-files-found: ignore
          retention-days: 3
