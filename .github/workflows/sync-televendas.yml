name: Sync Televendas

on:
  schedule:
    # ── Seg–Sáb 7h–18h30 BRT (10h–21h25 UTC): a cada 5 min ──
    - cron: '*/5 10-20 * * 1-6'           # 7h00–17h55 BRT
    - cron: '0,5,10,15,20,25 21 * * 1-6'  # 18h00–18h25 BRT

    # ── Seg–Sáb 18h30–00h00 BRT (21h30 UTC – 03h00 UTC): a cada 30 min ──
    - cron: '30 21 * * 1-6'               # 18h30 BRT
    - cron: '0,30 22,23 * * 1-6'          # 19h00–20h30 BRT
    - cron: '0,30 0,1,2 * * 0,2-6'        # 21h00–23h30 BRT (00h–02h30 UTC Ter–Dom)

    # ── Domingo BRT: a cada hora ──
    - cron: '0 3-23 * * 0'                # Dom 00h–20h BRT (03h–23h UTC Dom)
    - cron: '0 0,1,2 * * 1'               # Dom 21h–23h BRT (00h–02h UTC Seg)

  workflow_dispatch: # permite rodar manualmente no GitHub

# Garante que apenas 1 run rode por vez.
# Se um novo trigger chegar enquanto outro está rodando, ele aguarda na fila (1 pendente).
# Triggers adicionais enquanto já há 1 pendente são descartados automaticamente pelo GitHub.
concurrency:
  group: sync-televendas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install playwright httpx beautifulsoup4
          playwright install chromium --with-deps

      - name: Rodar sync
        env:
          MOVERE_USER: ${{ secrets.MOVERE_USER }}
          MOVERE_PASS: ${{ secrets.MOVERE_PASS }}
        run: python sync_televendas.py
