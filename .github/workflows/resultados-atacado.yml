name: Resultados Atacado (rotina 553)

# Grava o "Resultado Atacado" da página /atacado (modelo do painel do Televendas): rotina 553 com as tabelas
# 2 ATACADO + 5 ATACADO PREMIUM, todas as lojas; mês, pneus do mês e os últimos 5 dias úteis, por vendedor e por loja.
# Acordado pelo sync-televendas de hora em hora (seg–sáb, 7h45 às 17h45). Cron 19h20 fecha o dia (reserva).
# Mesmo grupo do Varejo ("movere-553"): os dois nunca usam o login do Movere ao mesmo tempo (um espera o outro).
on:
  schedule:
    - cron: '20 23 * * 1-6'
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só mostrar o que faria, sem gravar nada'
        type: boolean
        default: false

concurrency:
  group: movere-553
  cancel-in-progress: false

jobs:
  atacado:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install playwright beautifulsoup4 httpx holidays cryptography
          playwright install --with-deps chromium

      - name: Rotina 553 → banco
        env:
          PYTHONUNBUFFERED: '1'   # registro com a hora real de cada linha
          MOVERE_USER: ${{ secrets.MOVERE_USER }}
          MOVERE_PASS: ${{ secrets.MOVERE_PASS }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.teste && '1' || '' }}
        run: python resultados_atacado.py
