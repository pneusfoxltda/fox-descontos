name: Resultados Atacado (rotina 553)

# Grava o "Resultado Atacado" da página /atacado (modelo do painel do Televendas): rotina 553 com as tabelas
# 2 ATACADO + 5 ATACADO PREMIUM, todas as lojas; mês, pneus do mês e os últimos 5 dias úteis, só da EQUIPE DO ATACADO
# (7 funcionários, EQUIPE_ATACADO em resultados_atacado.py; o TOTAL SETOR é a soma deles).
# Só 2 vezes por dia (decisão do TI, 26/11/2026): seg–sáb, 8h e 17h30 de Porto Velho (UTC−4). Não é mais acordado pelo
# sync-televendas. Mesmo grupo do Varejo ("movere-553"): os dois nunca usam o login do Movere ao mesmo tempo.
on:
  schedule:
    - cron: '0 12 * * 1-6'    # 8h00 de Porto Velho
    - cron: '30 21 * * 1-6'   # 17h30 de Porto Velho
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só mostrar o que faria, sem gravar nada'
        type: boolean
        default: false

concurrency:
  group: movere-553
  cancel-in-progress: false

jobs:
  atacado:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install playwright beautifulsoup4 httpx holidays cryptography
          playwright install --with-deps chromium

      - name: Rotina 553 → banco
        env:
          PYTHONUNBUFFERED: '1'   # registro com a hora real de cada linha
          MOVERE_USER: ${{ secrets.MOVERE_USER }}
          MOVERE_PASS: ${{ secrets.MOVERE_PASS }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.teste && '1' || '' }}
        run: python resultados_atacado.py
