name: Teste Movere (Debug)

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala dependências
        run: |
          pip install playwright beautifulsoup4 httpx holidays cryptography --break-system-packages 2>/dev/null || \
          pip install playwright beautifulsoup4 httpx holidays cryptography
          playwright install chromium
          playwright install-deps chromium

      - name: Roda teste
        env:
          MOVERE_USER: ${{ secrets.MOVERE_USER }}
          MOVERE_PASS: ${{ secrets.MOVERE_PASS }}
          DATA_INI: '01/11/2026'
          DATA_FIM: '21/11/2026'
          SEM_ATACADO: '1'
          ANALYTICS_LOGIN: ${{ secrets.ANALYTICS_LOGIN }}
          ANALYTICS_SENHA: ${{ secrets.ANALYTICS_SENHA }}
          FRETE: '1'
        run: if [ "${{ github.ref_name }}" = varejo-553 ]; then python3 varejo_teste.py; fi

      - name: Sobe screenshots e HTML como artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-movere
          path: |
            screenshot_*.png
            html_capturado.html
          if-no-files-found: warn
