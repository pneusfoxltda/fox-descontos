<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fox Pneus — Atacado</title>
<style>
  :root {
    --bg: #0d0d0d;
    --bg2: #161616;
    --bg3: #1e1e1e;
    --border: #2a2a2a;
    --accent: #e63329;
    --accent2: #ff6b35;
    --gold: #f5a623;
    --green: #27ae60;
    --text: #f0f0f0;
    --muted: #888;
    --card-shadow: 0 4px 24px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* ── Header ── */
  .header {
    background: var(--bg2);
    border-bottom: 2px solid var(--accent);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo { width: 42px; height: 42px; background: var(--accent); border-radius: 10px;
          display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .header-title h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: .5px; }
  .header-title p { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .btn-admin { background: transparent; border: 1px solid var(--border); color: var(--muted);
               padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: .8rem;
               transition: all .2s; }
  .btn-admin:hover { border-color: var(--accent); color: var(--accent); }

  /* ── MÊS / DIAS ── */
  .mes-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: .82rem;
    color: var(--muted);
  }
  .mes-bar span strong { color: var(--text); }

  /* ── Tela seleção ── */
  #screen-select { padding: 32px 24px; }
  #screen-select h2 { font-size: 1rem; color: var(--muted); margin-bottom: 20px;
                       text-transform: uppercase; letter-spacing: 1px; }
  .grid-vendedoras {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card-vendedor {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    overflow: hidden;
  }
  .card-vendedor:hover { border-color: var(--accent); transform: translateY(-2px);
                          box-shadow: var(--card-shadow); }
  .card-vendedor::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .card-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; font-weight: 700; color: white;
    margin-bottom: 12px;
  }
  .card-nome { font-size: .95rem; font-weight: 600; margin-bottom: 4px; }
  .card-cod  { font-size: .75rem; color: var(--muted); margin-bottom: 14px; }
  .mini-progress-label { font-size: .72rem; color: var(--muted); display: flex;
                          justify-content: space-between; margin-bottom: 5px; }
  .mini-bar { height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .mini-bar-fill { height: 100%; border-radius: 99px;
                    background: linear-gradient(90deg, var(--accent), var(--accent2));
                    transition: width .6s ease; }
  .mini-valor { font-size: .82rem; color: var(--gold); font-weight: 600; margin-top: 8px; }
  .badge-semeta { font-size: .7rem; color: var(--muted); background: var(--bg3);
                   padding: 3px 8px; border-radius: 99px; display: inline-block; margin-top: 6px; }

  /* ── Tela dashboard ── */
  #screen-dash { display: none; padding: 24px; }
  .btn-back { background: none; border: 1px solid var(--border); color: var(--muted);
               padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: .8rem;
               margin-bottom: 20px; transition: all .2s; }
  .btn-back:hover { border-color: var(--accent); color: var(--accent); }

  .dash-header { margin-bottom: 24px; }
  .dash-nome { font-size: 1.5rem; font-weight: 700; }
  .dash-cod  { font-size: .8rem; color: var(--muted); }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; position: relative; overflow: hidden;
  }
  .kpi-label { font-size: .72rem; color: var(--muted); text-transform: uppercase;
                letter-spacing: .8px; margin-bottom: 8px; }
  .kpi-value { font-size: 1.5rem; font-weight: 700; }
  .kpi-value.green { color: var(--green); }
  .kpi-value.gold  { color: var(--gold); }
  .kpi-value.red   { color: var(--accent); }
  .kpi-value.blue  { color: #4fc3f7; }
  .kpi-sub { font-size: .75rem; color: var(--muted); margin-top: 4px; }

  /* Barra de progresso da meta */
  .meta-progress-wrap { background: var(--bg2); border: 1px solid var(--border);
                         border-radius: 10px; padding: 20px; margin-bottom: 24px; }
  .meta-progress-top  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .meta-progress-top .label { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  .meta-progress-top .pct   { font-size: 1.3rem; font-weight: 700; }
  .progress-track { height: 14px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill  { height: 100%; border-radius: 99px; transition: width .8s ease;
                     background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .progress-fill.ok { background: linear-gradient(90deg, #27ae60, #2ecc71); }
  .meta-progress-bottom { display: flex; justify-content: space-between; margin-top: 10px;
                            font-size: .78rem; color: var(--muted); }

  /* Tabela dias */
  .dias-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .dias-wrap h3 { padding: 14px 18px; font-size: .82rem; color: var(--muted);
                   text-transform: uppercase; letter-spacing: .8px; border-bottom: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th, td { padding: 10px 18px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--bg3); font-size: .72rem; color: var(--muted); text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  td.valor { color: var(--gold); font-weight: 600; }
  td.zero  { color: var(--muted); }

  /* ── Admin ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8);
                    z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
            padding: 28px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 1rem; margin-bottom: 6px; }
  .modal p.sub { font-size: .78rem; color: var(--muted); margin-bottom: 20px; }
  .admin-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .admin-row label { flex: 1; font-size: .82rem; color: var(--muted); }
  .admin-row label strong { display: block; color: var(--text); font-size: .88rem; }
  .admin-row input { width: 150px; background: var(--bg3); border: 1px solid var(--border);
                      color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: .88rem; }
  .admin-dias { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
  .admin-dias label { font-size: .82rem; color: var(--muted); display: block; margin-bottom: 6px; }
  .admin-dias label strong { color: var(--text); }
  .admin-dias input { width: 100px; background: var(--bg3); border: 1px solid var(--border);
                       color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: .88rem; }
  .btn-salvar { width: 100%; background: var(--accent); color: white; border: none;
                 padding: 12px; border-radius: 8px; font-size: .95rem; font-weight: 600;
                 cursor: pointer; margin-top: 20px; transition: opacity .2s; }
  .btn-salvar:hover { opacity: .85; }
  .btn-fechar { background: none; border: none; color: var(--muted); font-size: .82rem;
                 cursor: pointer; margin-top: 10px; width: 100%; text-align: center; }
  .msg-ok { background: rgba(39,174,96,.15); border: 1px solid #27ae60; color: #27ae60;
              padding: 10px 14px; border-radius: 6px; font-size: .82rem; margin-top: 12px;
              display: none; }

  /* Auth admin */
  .auth-wrap { margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .auth-wrap input { width: 100%; background: var(--bg3); border: 1px solid var(--border);
                      color: var(--text); padding: 9px 12px; border-radius: 6px; font-size: .88rem;
                      margin-bottom: 8px; }
  .btn-login-admin { width: 100%; background: var(--bg3); border: 1px solid var(--border);
                      color: var(--text); padding: 9px; border-radius: 6px; cursor: pointer;
                      font-size: .88rem; transition: all .2s; }
  .btn-login-admin:hover { border-color: var(--accent); }
  .err-auth { color: var(--accent); font-size: .78rem; margin-top: 4px; display: none; }

  @media (max-width: 600px) {
    .kpi-grid { grid-template-columns: 1fr 1fr; }
    .grid-vendedoras { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="logo">🦊</div>
    <div class="header-title">
      <h1>FOX PNEUS</h1>
      <p>Atacado — Vendedoras</p>
    </div>
  </div>
  <button class="btn-admin" onclick="abrirAdmin()">⚙️ Metas / Dias úteis</button>
</div>

<!-- Barra de mês -->
<div class="mes-bar" id="mesBar">
  <span>Carregando...</span>
</div>

<!-- Tela seleção -->
<div id="screen-select">
  <h2>Selecione a vendedora</h2>
  <div class="grid-vendedoras" id="gridVendedoras">
    <div style="color:var(--muted);font-size:.85rem">Carregando dados...</div>
  </div>
</div>

<!-- Tela dashboard -->
<div id="screen-dash">
  <button class="btn-back" onclick="voltarSelect()">← Voltar</button>
  <div class="dash-header">
    <div class="dash-nome" id="dashNome">—</div>
    <div class="dash-cod" id="dashCod">—</div>
  </div>
  <div class="kpi-grid" id="kpiGrid"></div>
  <div class="meta-progress-wrap" id="metaProgressWrap" style="display:none">
    <div class="meta-progress-top">
      <span class="label">Progresso da Meta</span>
      <span class="pct" id="metaPct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="meta-progress-bottom">
      <span id="progBottom1">—</span>
      <span id="progBottom2">—</span>
    </div>
  </div>
  <div class="dias-wrap">
    <h3>Vendas por dia útil</h3>
    <table id="tabelaDias">
      <thead><tr><th>Data</th><th>Dia</th><th>Valor</th></tr></thead>
      <tbody id="tbodyDias"></tbody>
    </table>
  </div>
</div>

<!-- Modal Admin -->
<div class="modal-overlay" id="modalAdmin">
  <div class="modal">
    <h2>⚙️ Metas &amp; Dias úteis</h2>
    <p class="sub" id="adminMesLabel">—</p>

    <!-- Auth -->
    <div class="auth-wrap" id="authWrap">
      <input type="password" id="adminSenha" placeholder="Senha de acesso" onkeyup="if(event.key==='Enter')loginAdmin()">
      <button class="btn-login-admin" onclick="loginAdmin()">Entrar</button>
      <div class="err-auth" id="errAuth">Senha incorreta</div>
    </div>

    <!-- Formulário (oculto até auth) -->
    <div id="adminForm" style="display:none">
      <div id="adminMetas"></div>
      <div class="admin-dias">
        <label><strong>Dias úteis do mês</strong><br>Total de dias úteis para calcular a meta diária</label>
        <input type="number" id="inputDiasUteis" min="1" max="31" placeholder="ex: 22">
      </div>
      <button class="btn-salvar" onclick="salvarMetas()">💾 Salvar metas</button>
      <div class="msg-ok" id="msgOk">✅ Metas salvas com sucesso!</div>
      <button class="btn-fechar" onclick="fecharAdmin()">Fechar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://dxwkiaxpygibzmwzvcuz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4d2tpYXhweWdpYnptd3p2Y3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTE3NzcsImV4cCI6MjA5Mjg4Nzc3N30.mVbUlLaRCI5OMf539Ehjt-XpfAY-wjr7_WCzPsgVvp0';

// Senha simples para o admin de atacado (Kleber)
const ADMIN_SENHA = 'fox@atacado2026';

const VENDEDORES = [
  { codigo: '291608', nome: 'Niorrana Carriço Ghisleri' },
  { codigo: '303101', nome: 'Nayza Minelli Pereira Oliveira' },
  { codigo: '322540', nome: 'Alyssandra Sales Marinho' },
  { codigo: '309110', nome: 'Camila da Silva Feitoza' },
  { codigo: '318707', nome: 'Camila Ramos Brilhante' },
  { codigo: '324865', nome: 'Rafaela Fernandes da Silva' },
];

const DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                   'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

let vendas = {};   // { codigo: [{data_ref, valor_venda}] }
let metas  = {};   // { codigo: { meta_valor, dias_uteis_mes } }
let mesRef = '';
let hoje = '';
let adminAutenticado = false;

function sbHeaders() {
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
}

async function sbGet(path) {
  const r = await fetch(SUPABASE_URL + path, { headers: sbHeaders() });
  if (!r.ok) throw new Error('Supabase ' + r.status);
  return r.json();
}

function getMesRef() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function formatBRL(v) {
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function formatDate(iso) {
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function iniciais(nome) {
  return nome.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();
}

function diasUteisRestantes(diasUteisTotal) {
  const agora = new Date();
  const ano = agora.getFullYear(), mes = agora.getMonth();
  const ultimoDia = new Date(ano, mes+1, 0).getDate();
  let restantes = 0;
  for (let d = agora.getDate()+1; d <= ultimoDia; d++) {
    const diaSem = new Date(ano, mes, d).getDay();
    if (diaSem >= 1 && diaSem <= 6) restantes++;
  }
  return restantes;
}

function diasUteisPassados() {
  const agora = new Date();
  const ano = agora.getFullYear(), mes = agora.getMonth();
  let passados = 0;
  for (let d = 1; d <= agora.getDate(); d++) {
    const diaSem = new Date(ano, mes, d).getDay();
    if (diaSem >= 1 && diaSem <= 6) passados++;
  }
  return passados;
}

async function carregarDados() {
  hoje   = new Date().toISOString().slice(0,10);
  mesRef = getMesRef();
  const mesIni = mesRef + '-01';
  const ultimo = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
  const mesFim = mesRef + '-' + String(ultimo).padStart(2,'0');

  // Atualiza barra de mês
  const mesIdx = parseInt(mesRef.split('-')[1]) - 1;
  document.getElementById('mesBar').innerHTML =
    `<span>📅 <strong>${MESES_PT[mesIdx]} ${mesRef.split('-')[0]}</strong></span>` +
    `<span>Atualização automática a cada 30 min</span>`;

  // Busca vendas
  const rows = await sbGet(
    `/rest/v1/vendas_atacado?select=data_ref,vendedor_codigo,valor_venda` +
    `&data_ref=gte.${mesIni}&data_ref=lte.${mesFim}&order=data_ref.asc`
  );

  vendas = {};
  VENDEDORES.forEach(v => { vendas[v.codigo] = []; });
  rows.forEach(r => {
    if (vendas[r.vendedor_codigo]) {
      vendas[r.vendedor_codigo].push({ data_ref: r.data_ref, valor_venda: parseFloat(r.valor_venda||0) });
    }
  });

  // Busca metas
  const metaRows = await sbGet(
    `/rest/v1/metas_atacado?select=vendedor_codigo,meta_valor,dias_uteis_mes` +
    `&mes_ref=eq.${mesRef}`
  ).catch(() => []);

  metas = {};
  metaRows.forEach(m => {
    metas[m.vendedor_codigo] = {
      meta_valor: parseFloat(m.meta_valor||0),
      dias_uteis_mes: parseInt(m.dias_uteis_mes||22)
    };
  });

  renderGrid();
}

function totalVendas(codigo) {
  return (vendas[codigo] || []).reduce((s, r) => s + r.valor_venda, 0);
}

function renderGrid() {
  const grid = document.getElementById('gridVendedoras');
  grid.innerHTML = '';

  VENDEDORES.forEach(v => {
    const total = totalVendas(v.codigo);
    const meta  = metas[v.codigo];
    const pct   = meta && meta.meta_valor > 0 ? Math.min((total / meta.meta_valor) * 100, 100) : 0;

    const card = document.createElement('div');
    card.className = 'card-vendedor';
    card.onclick = () => abrirDash(v.codigo);

    let metaHtml = '';
    if (meta && meta.meta_valor > 0) {
      metaHtml = `
        <div class="mini-progress-label">
          <span>${formatBRL(total)}</span>
          <span>${pct.toFixed(1)}%</span>
        </div>
        <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
        <div class="mini-valor">Meta: ${formatBRL(meta.meta_valor)}</div>`;
    } else {
      metaHtml = `<div class="mini-valor">${formatBRL(total)}</div>
                   <span class="badge-semeta">Meta não definida</span>`;
    }

    card.innerHTML = `
      <div class="card-avatar">${iniciais(v.nome)}</div>
      <div class="card-nome">${v.nome}</div>
      <div class="card-cod">Cód. ${v.codigo}</div>
      ${metaHtml}`;
    grid.appendChild(card);
  });
}

function abrirDash(codigo) {
  const v = VENDEDORES.find(x => x.codigo === codigo);
  if (!v) return;

  document.getElementById('screen-select').style.display = 'none';
  document.getElementById('screen-dash').style.display = 'block';
  document.getElementById('dashNome').textContent = v.nome;
  document.getElementById('dashCod').textContent  = `Cód. ${v.codigo} · ${getMesRef().replace('-','/')}`;

  const total  = totalVendas(codigo);
  const meta   = metas[codigo];
  const diasU  = meta ? meta.dias_uteis_mes : 22;
  const diasP  = diasUteisPassados();
  const diasR  = diasUteisRestantes(diasU);
  const metaV  = meta ? meta.meta_valor : 0;
  const pct    = metaV > 0 ? (total / metaV * 100) : 0;
  const restante = Math.max(metaV - total, 0);
  const porDia = diasR > 0 ? restante / diasR : 0;
  const mediaDia = diasP > 0 ? total / diasP : 0;

  // KPIs
  const kpiGrid = document.getElementById('kpiGrid');
  kpiGrid.innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Faturamento do Mês</div>
      <div class="kpi-value gold">${formatBRL(total)}</div>
      <div class="kpi-sub">acumulado até hoje</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Meta Mensal</div>
      <div class="kpi-value blue">${metaV > 0 ? formatBRL(metaV) : '—'}</div>
      <div class="kpi-sub">${diasU} dias úteis no mês</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Precisa por dia (restante)</div>
      <div class="kpi-value ${porDia > 0 ? 'red' : 'green'}">${diasR > 0 && metaV > 0 ? formatBRL(porDia) : '✅'}</div>
      <div class="kpi-sub">${diasR} dias úteis restantes</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Média diária atual</div>
      <div class="kpi-value green">${formatBRL(mediaDia)}</div>
      <div class="kpi-sub">${diasP} dias úteis trabalhados</div>
    </div>`;

  // Barra de progresso
  const wrap = document.getElementById('metaProgressWrap');
  if (metaV > 0) {
    wrap.style.display = 'block';
    document.getElementById('metaPct').textContent = pct.toFixed(1) + '%';
    const fill = document.getElementById('progressFill');
    fill.style.width = pct + '%';
    fill.className = 'progress-fill' + (pct >= 100 ? ' ok' : '');
    document.getElementById('progBottom1').textContent = `${formatBRL(total)} faturado`;
    document.getElementById('progBottom2').textContent = `Faltam ${formatBRL(restante)}`;
  } else {
    wrap.style.display = 'none';
  }

  // Tabela de dias
  const tbody = document.getElementById('tbodyDias');
  tbody.innerHTML = '';
  const diasVendedor = vendas[codigo] || [];
  if (diasVendedor.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="color:var(--muted);text-align:center">Sem dados este mês</td></tr>';
  } else {
    [...diasVendedor].reverse().forEach(r => {
      const dt = new Date(r.data_ref + 'T12:00:00');
      const diaSem = DIAS_SEMANA[dt.getDay()];
      const valor = r.valor_venda;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${formatDate(r.data_ref)}</td>
        <td style="color:var(--muted)">${diaSem}</td>
        <td class="${valor > 0 ? 'valor' : 'zero'}">${formatBRL(valor)}</td>`;
      tbody.appendChild(tr);
    });
  }
}

function voltarSelect() {
  document.getElementById('screen-select').style.display = 'block';
  document.getElementById('screen-dash').style.display = 'none';
}

// ── Admin ──────────────────────────────────────────────────────────────────

function abrirAdmin() {
  document.getElementById('modalAdmin').classList.add('open');
  const mesIdx = parseInt(mesRef.split('-')[1]) - 1;
  document.getElementById('adminMesLabel').textContent =
    `Configurando metas para ${MESES_PT[mesIdx]} ${mesRef.split('-')[0]}`;

  if (adminAutenticado) mostrarFormAdmin();
  else {
    document.getElementById('authWrap').style.display = 'block';
    document.getElementById('adminForm').style.display = 'none';
  }
}

function loginAdmin() {
  const senha = document.getElementById('adminSenha').value;
  if (senha === ADMIN_SENHA) {
    adminAutenticado = true;
    document.getElementById('errAuth').style.display = 'none';
    mostrarFormAdmin();
  } else {
    document.getElementById('errAuth').style.display = 'block';
  }
}

function mostrarFormAdmin() {
  document.getElementById('authWrap').style.display = 'none';
  document.getElementById('adminForm').style.display = 'block';

  const metasDiv = document.getElementById('adminMetas');
  metasDiv.innerHTML = '';
  VENDEDORES.forEach(v => {
    const metaAtual = metas[v.codigo] ? metas[v.codigo].meta_valor : '';
    metasDiv.innerHTML += `
      <div class="admin-row">
        <label><strong>${v.nome}</strong><br>Cód. ${v.codigo}</label>
        <input type="number" id="meta_${v.codigo}" placeholder="R$ meta" value="${metaAtual || ''}" step="1000" min="0">
      </div>`;
  });

  const diasAtual = metas[VENDEDORES[0].codigo] ? metas[VENDEDORES[0].codigo].dias_uteis_mes : '';
  document.getElementById('inputDiasUteis').value = diasAtual || '';
}

async function salvarMetas() {
  const diasUteis = parseInt(document.getElementById('inputDiasUteis').value) || 22;
  const agora = new Date().toISOString();

  const payload = VENDEDORES.map(v => {
    const val = parseFloat(document.getElementById('meta_' + v.codigo).value) || 0;
    return {
      mes_ref: mesRef,
      vendedor_codigo: v.codigo,
      vendedor_nome: v.nome,
      meta_valor: val,
      dias_uteis_mes: diasUteis,
      atualizado_em: agora
    };
  });

  try {
    const r = await fetch(
      SUPABASE_URL + '/rest/v1/metas_atacado?on_conflict=mes_ref,vendedor_codigo',
      {
        method: 'POST',
        headers: { ...sbHeaders(), 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify(payload)
      }
    );
    if (r.ok || r.status === 200 || r.status === 201) {
      document.getElementById('msgOk').style.display = 'block';
      setTimeout(() => { document.getElementById('msgOk').style.display = 'none'; }, 3000);
      // Atualiza local
      payload.forEach(p => {
        metas[p.vendedor_codigo] = { meta_valor: p.meta_valor, dias_uteis_mes: p.dias_uteis_mes };
      });
      renderGrid();
    } else {
      alert('Erro ao salvar. Status: ' + r.status);
    }
  } catch(e) {
    alert('Erro: ' + e.message);
  }
}

function fecharAdmin() {
  document.getElementById('modalAdmin').classList.remove('open');
}

// Fecha modal clicando fora
document.getElementById('modalAdmin').addEventListener('click', function(e) {
  if (e.target === this) fecharAdmin();
});

// Inicia
carregarDados();
</script>
