<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Televendas — Fox Pneus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f4f6f9;color:#1a2332;font-family:'Inter',sans-serif;min-height:100vh;}

/* ── Header ── */
.header{background:#0f1f3d;padding:14px 24px;display:flex;align-items:center;gap:12px;}
.logo{width:38px;height:38px;background:#CC1F1F;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.brand{color:#fff;font-weight:700;font-size:16px;}
.brand small{display:block;font-size:11px;color:#8899bb;font-weight:400;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.sync-info{font-size:11px;color:#8899bb;text-align:right;}
.btn-refresh{background:#1e3a6e;border:none;color:#8fb3ff;font-size:11px;border-radius:6px;padding:6px 12px;cursor:pointer;transition:.15s;}
.btn-refresh:hover{background:#2a4d8f;color:#fff;}

/* ── Container ── */
.container{max-width:1100px;margin:0 auto;padding:20px 16px;}

/* ── Título ── */
.page-header{margin-bottom:16px;}
.page-title{font-size:22px;font-weight:800;color:#0f1f3d;}
.page-title span{color:#CC1F1F;}
.page-meta{font-size:12px;color:#7a8ba0;margin-top:3px;}

/* ── Metas ── */
.metas-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.meta-btn{background:#fff;border:2px solid #dde3ec;border-radius:8px;padding:8px 16px;cursor:pointer;transition:.15s;text-align:center;}
.meta-btn:hover{border-color:#0f1f3d;}
.meta-btn.active{background:#0f1f3d;border-color:#0f1f3d;color:#fff;}
.meta-btn .meta-label{font-size:11px;font-weight:600;opacity:.7;}
.meta-btn .meta-valor{font-size:14px;font-weight:800;}
.meta-btn.active .meta-label{opacity:.8;}

/* ── KPIs ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #e2e8f0;box-shadow:0 1px 3px #0001;}
.kpi-label{font-size:11px;font-weight:600;color:#7a8ba0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.kpi-valor{font-size:22px;font-weight:800;color:#0f1f3d;}
.kpi-valor.vermelho{color:#CC1F1F;}
.kpi-valor.verde{color:#16a34a;}
.kpi-sub{font-size:11px;color:#9aabb8;margin-top:4px;}
.progress-bar{height:6px;background:#e2e8f0;border-radius:3px;margin-top:8px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;background:#CC1F1F;transition:width .6s;}
.progress-fill.verde{background:#16a34a;}

/* ── Tabela ── */
.table-wrap{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 3px #0001;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:#0f1f3d;color:#fff;}
th{padding:11px 12px;font-weight:600;font-size:11px;text-align:right;letter-spacing:.3px;}
th:first-child{text-align:left;}
.th-dias{background:#e85d04;color:#fff;text-align:center;}
tbody tr{border-bottom:1px solid #f0f4f8;transition:.1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#f8fafc;}
tbody tr.total-row{background:#f1f5f9;font-weight:700;}
td{padding:11px 12px;text-align:right;color:#1a2332;}
td:first-child{text-align:left;font-weight:700;}
td.verde{color:#16a34a;font-weight:700;}
td.vermelho{color:#CC1F1F;font-weight:700;}
td.dia-col{color:#374151;font-size:12px;}
td.meta-col{color:#6b7280;}

/* ── Badge % ── */
.pct-badge{display:inline-block;padding:3px 8px;border-radius:5px;font-size:12px;font-weight:700;}
.pct-badge.verde{background:#dcfce7;color:#16a34a;}
.pct-badge.amarelo{background:#fef9c3;color:#b45309;}
.pct-badge.vermelho{background:#fee2e2;color:#CC1F1F;}

/* ── Legenda ── */
.legenda{display:flex;gap:20px;padding:10px 12px;background:#f8fafc;font-size:11px;color:#7a8ba0;border-top:1px solid #e2e8f0;}
.leg-item{display:flex;align-items:center;gap:5px;}
.leg-dot{width:8px;height:8px;border-radius:50%;}

/* ── Loading / Error ── */
.loading{text-align:center;padding:60px;color:#9aabb8;}
.spinner{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#CC1F1F;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.erro{background:#fff5f5;border:1px solid #fca5a5;border-radius:10px;padding:16px;color:#CC1F1F;font-size:13px;text-align:center;}

/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:14px;padding:24px;width:360px;box-shadow:0 20px 60px #0003;}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px;color:#0f1f3d;}
.modal-grid{display:grid;gap:10px;margin-bottom:16px;}
.modal-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.modal-row label{font-size:13px;color:#374151;flex:1;}
.modal-row input{width:130px;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:14px;text-align:right;}
.modal-row input:focus{outline:none;border-color:#0f1f3d;}
.modal-btns{display:flex;gap:10px;}
.modal-btns button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-ok{background:#0f1f3d;color:#fff;}
.btn-cancel{background:#f1f5f9;color:#374151;}
.btn-editar-meta{background:none;border:1px solid #d1d5db;border-radius:6px;color:#6b7280;font-size:11px;padding:5px 10px;cursor:pointer;margin-left:8px;}
.btn-editar-meta:hover{border-color:#0f1f3d;color:#0f1f3d;}

@media(max-width:700px){
  .kpis{grid-template-columns:1fr 1fr;}
  .kpi-valor{font-size:18px;}
  table{font-size:11px;}
  th,td{padding:8px 6px;}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">🦊</div>
  <div class="brand">Fox Pneus <small>Grupo Redefox</small></div>
  <div class="header-right">
    <div class="sync-info" id="sync-info">—</div>
    <button class="btn-refresh" onclick="carregar(true)">↻ Atualizar</button>
  </div>
</header>

<div class="container">

  <div class="page-header">
    <div class="page-title">Televendas <span>Fox Pneus</span></div>
    <div class="page-meta" id="page-meta">Carregando…</div>
  </div>

  <!-- Metas -->
  <div class="metas-row" id="metas-row">
    <div class="meta-btn active" onclick="setMeta(0)" id="meta-btn-0">
      <div class="meta-label">Meta 1</div>
      <div class="meta-valor" id="meta-btn-val-0">—</div>
    </div>
    <div class="meta-btn" onclick="setMeta(1)" id="meta-btn-1">
      <div class="meta-label">Meta 2 (+10%)</div>
      <div class="meta-valor" id="meta-btn-val-1">—</div>
    </div>
    <div class="meta-btn" onclick="setMeta(2)" id="meta-btn-2">
      <div class="meta-label">Meta 3 (+20%)</div>
      <div class="meta-valor" id="meta-btn-val-2">—</div>
    </div>
    <button class="btn-editar-meta" onclick="abrirModal()" id="btn-admin" style="display:none">✏️ Editar metas</button>
  </div>

  <!-- KPIs -->
  <div class="kpis" id="kpis">
    <div class="loading"><div class="spinner"></div>Buscando dados…</div>
  </div>

  <!-- Tabela -->
  <div id="tabela-wrap"></div>

</div>

<!-- Modal de metas por operador -->
<div class="modal-bg" id="modal-metas">
  <div class="modal">
    <h3>Metas mensais por operador (R$)</h3>
    <div class="modal-grid" id="modal-inputs"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-ok" onclick="salvarMetas()">Salvar</button>
    </div>
  </div>
</div>

<script>
/* ── Supabase ── */
const SB_URL = "https://dxwkiaxpygibzmwzvcuz.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4d2tpYXhweWdpYnptd3p2Y3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTE3NzcsImV4cCI6MjA5Mjg4Nzc3N30.mVbUlLaRCI5OMf539Ehjt-XpfAY-wjr7_WCzPsgVvp0";

const OPERADORES = [
  {codigo:"294862", nome:"Graziele Garcia"},
  {codigo:"299497", nome:"Kessya Marques"},
  {codigo:"286240", nome:"Sabrina Rocha"},
  {codigo:"298172", nome:"Ana Clara"},
];

/* ── Metas padrão ── */
const METAS_DEFAULT = {
  "294862": 480000,
  "299497": 480000,
  "286240": 480000,
  "298172": 280000,
};

let metas = {...METAS_DEFAULT};
let metaIdx = 0; // 0=100%, 1=110%, 2=120%
const META_MULT = [1, 1.1, 1.2];

function loadPrefs() {
  try {
    const m = localStorage.getItem('fox_tv_metas');
    if (m) metas = {...METAS_DEFAULT, ...JSON.parse(m)};
    const mi = localStorage.getItem('fox_tv_meta_idx');
    if (mi !== null) metaIdx = parseInt(mi);
  } catch(e){}
}

function savePrefs() {
  try {
    localStorage.setItem('fox_tv_metas', JSON.stringify(metas));
    localStorage.setItem('fox_tv_meta_idx', metaIdx);
  } catch(e){}
}

function metaTotal(mult) {
  return Object.values(metas).reduce((a,b)=>a+b,0) * mult;
}

function metaOp(codigo, mult) {
  return (metas[codigo] || 0) * mult;
}

/* ── Formatação ── */
function brl(v, dec=0) {
  return 'R$ ' + (v||0).toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function pct(v) { return Math.round(v||0) + '%'; }
function dataBR(iso) {
  const [,m,d] = iso.split('-');
  return `${d}/${m}`;
}

/* ── Dias úteis (seg–sáb) ── */
function diasUteis(ano, mes) {
  // 1-indexed mes
  const total = new Date(ano, mes, 0).getDate();
  let dias = [];
  for(let d=1; d<=total; d++) {
    const dow = new Date(ano, mes-1, d).getDay();
    if(dow >= 1 && dow <= 6) dias.push(d);
  }
  return dias;
}

function diasUteisPassados(ano, mes, hoje) {
  return diasUteis(ano, mes).filter(d => d <= hoje).length;
}

/* ── Busca Supabase ── */
async function buscarMes() {
  const agora = new Date();
  const ano = agora.getFullYear();
  const mes = String(agora.getMonth()+1).padStart(2,'0');
  const ini = `${ano}-${mes}-01`;
  const fim = `${ano}-${mes}-31`;

  const url = `${SB_URL}/rest/v1/vendas_televendas?data_ref=gte.${ini}&data_ref=lte.${fim}&order=data_ref.asc`;
  const r = await fetch(url, {headers:{apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`}});
  if(!r.ok) throw new Error(`Supabase ${r.status}`);
  return r.json();
}

/* ── Render ── */
function render(rows) {
  const agora = new Date();
  const ano = agora.getFullYear();
  const mes = agora.getMonth()+1;
  const diaHoje = agora.getDate();

  const duTotal = diasUteis(ano, mes).length;
  const duPassados = diasUteisPassados(ano, mes, diaHoje);
  const pctDesejado = duTotal > 0 ? Math.round(duPassados / duTotal * 100) : 0;

  const mult = META_MULT[metaIdx];
  const metaSetorTotal = metaTotal(mult);

  // Botões de meta
  META_MULT.forEach((m,i) => {
    const label = i===0 ? 'Meta 1' : `Meta ${i+1} (+${Math.round((m-1)*100)}%)`;
    document.getElementById(`meta-btn-val-${i}`).textContent = brl(metaTotal(m));
    document.getElementById(`meta-btn-${i}`).classList.toggle('active', i===metaIdx);
  });

  // Agrupar por operador e por data
  const porOp = {}; // codigo → {totalMes, porDia:{iso→valor}}
  const datasSet = new Set();

  OPERADORES.forEach(op => {
    porOp[op.codigo] = {nome: op.nome, totalMes: 0, porDia: {}};
  });

  rows.forEach(r => {
    if(!porOp[r.operador_codigo]) return;
    porOp[r.operador_codigo].totalMes += r.valor_venda || 0;
    porOp[r.operador_codigo].porDia[r.data_ref] = (porOp[r.operador_codigo].porDia[r.data_ref]||0) + (r.valor_venda||0);
    datasSet.add(r.data_ref);
  });

  // Últimas 5 datas com dados
  const datas5 = Array.from(datasSet).sort().slice(-5);

  // Totais do setor
  const totalMes = Object.values(porOp).reduce((a,op)=>a+op.totalMes,0);
  const pctMeta = metaSetorTotal > 0 ? totalMes / metaSetorTotal * 100 : 0;
  const faltaMeta = Math.max(0, metaSetorTotal - totalMes);
  const duRestantes = Math.max(1, duTotal - duPassados);
  const precisaPorDia = faltaMeta / duRestantes;

  // Data última sync
  const ultSyncRows = rows.filter(r=>r.atualizado_em);
  const ultSync = ultSyncRows.length > 0
    ? new Date(ultSyncRows[ultSyncRows.length-1].atualizado_em)
        .toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'})
    : null;

  // page-meta
  const ultimaDia = datas5.length > 0 ? dataBR(datas5[datas5.length-1]) : '—';
  document.getElementById('page-meta').textContent =
    `Vendas até ${ultimaDia} · ${ultSync ? 'atualizado em ' + ultSync : 'aguardando sincronização'} · fonte: Movere`;

  document.getElementById('sync-info').innerHTML =
    `Atualiza a cada 5 min<br><small style="color:#556">Fonte: Movere ERP</small>`;

  // KPIs
  const kpiBar = Math.min(pctMeta, 100);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi">
      <div class="kpi-label">Faturamento do setor</div>
      <div class="kpi-valor">${brl(totalMes)}</div>
      <div class="kpi-sub">meta ${brl(metaSetorTotal)}</div>
      <div class="progress-bar"><div class="progress-fill ${pctMeta>=pctDesejado?'verde':''}" style="width:${kpiBar}%"></div></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">% da meta</div>
      <div class="kpi-valor ${pctMeta>=pctDesejado?'verde':'vermelho'}">${pct(pctMeta)}</div>
      <div class="kpi-sub">desejado: ${pct(pctDesejado)}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">% desejado do dia</div>
      <div class="kpi-valor">${pct(pctDesejado)}</div>
      <div class="kpi-sub">${duPassados} de ${duTotal} dias úteis</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Falta para a meta</div>
      <div class="kpi-valor vermelho">${brl(faltaMeta)}</div>
      <div class="kpi-sub">${duRestantes} dia${duRestantes!==1?'s':''} útil${duRestantes!==1?'s':''} restante${duRestantes!==1?'s':''}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Setor precisa por dia</div>
      <div class="kpi-valor">${brl(precisaPorDia)}</div>
      <div class="kpi-sub">meta diária original ${brl(metaSetorTotal/duTotal)}</div>
    </div>
  `;

  // Tabela
  if(rows.length === 0) {
    document.getElementById('tabela-wrap').innerHTML =
      `<div class="erro" style="margin-top:16px">Sem dados para este mês ainda.<br><small>Execute o script sync_televendas.py para sincronizar.</small></div>`;
    return;
  }

  // Ordenar operadores por % atingido desc
  const opsOrdenadas = OPERADORES.map(op => {
    const data = porOp[op.codigo];
    const metaOp2 = metaOp(op.codigo, mult);
    const pctOp = metaOp2 > 0 ? data.totalMes / metaOp2 * 100 : 0;
    const faltaOp = Math.max(0, metaOp2 - data.totalMes);
    const precisaOp = faltaOp / duRestantes;
    return {...op, ...data, metaOp: metaOp2, pctOp, faltaOp, precisaOp};
  }).sort((a,b)=>b.pctOp-a.pctOp);

  const colDias = datas5.map(d=>`<th class="th-dias">${dataBR(d)}</th>`).join('');
  const colDiasTotals = datas5.map(d=>{
    const tot = OPERADORES.reduce((a,op)=>{
      return a + (porOp[op.codigo]?.porDia?.[d]||0);
    },0);
    return `<td class="dia-col">${brl(tot)}</td>`;
  }).join('');

  const linhas = opsOrdenadas.map(op => {
    const cor = op.pctOp >= pctDesejado ? 'verde' : 'vermelho';
    const badge = op.pctOp >= pctDesejado ? 'verde' : (op.pctOp >= pctDesejado*0.7 ? 'amarelo' : 'vermelho');
    const diasCols = datas5.map(d=>
      `<td class="dia-col">${op.porDia[d] ? brl(op.porDia[d]) : '—'}</td>`
    ).join('');
    return `
    <tr>
      <td class="${cor}">${op.nome.toUpperCase()}</td>
      <td class="meta-col">${brl(op.metaOp)}</td>
      ${diasCols}
      <td>${brl(op.totalMes)}</td>
      <td>${brl(op.precisaOp)}</td>
      <td><span class="pct-badge ${badge}">${pct(op.pctOp)}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('tabela-wrap').innerHTML = `
  <div class="table-wrap" style="margin-top:16px;">
    <table>
      <thead>
        <tr>
          <th style="text-align:left">Operadora</th>
          <th>Meta</th>
          <th colspan="${datas5.length}" class="th-dias">Últimos ${datas5.length} dias úteis</th>
          <th>Faturamento<br>do mês</th>
          <th>Precisa por dia<br>(${duRestantes} dias)</th>
          <th>% atingido</th>
        </tr>
        <tr style="background:#1a3050;">
          <th></th><th></th>${colDias}<th></th><th></th><th></th>
        </tr>
      </thead>
      <tbody>
        ${linhas}
        <tr class="total-row">
          <td>TOTAL SETOR</td>
          <td class="meta-col">${brl(metaSetorTotal)}</td>
          ${colDiasTotals}
          <td>${brl(totalMes)}</td>
          <td>${brl(precisaPorDia)}</td>
          <td><span class="pct-badge ${pctMeta>=pctDesejado?'verde':'vermelho'}">${pct(pctMeta)}</span></td>
        </tr>
      </tbody>
    </table>
    <div class="legenda">
      <div class="leg-item"><span class="leg-dot" style="background:#16a34a"></span> No ritmo (% atingido ≥ % desejado do dia)</div>
      <div class="leg-item"><span class="leg-dot" style="background:#CC1F1F"></span> Abaixo do ritmo</div>
      <span style="margin-left:auto">Ordenado pelo maior % atingido</span>
    </div>
  </div>`;
}

/* ── Carregar ── */
async function carregar(forcar=false) {
  try {
    const rows = await buscarMes();
    render(rows);
    updateMetaBtns();
  } catch(e) {
    document.getElementById('kpis').innerHTML = `<div class="erro">Erro ao carregar: ${e.message}</div>`;
  }
}

function updateMetaBtns() {
  META_MULT.forEach((m,i) => {
    document.getElementById(`meta-btn-val-${i}`).textContent = brl(metaTotal(m));
    document.getElementById(`meta-btn-${i}`).classList.toggle('active', i===metaIdx);
  });
}

function setMeta(idx) {
  metaIdx = idx;
  savePrefs();
  carregar();
}

/* ── Modal ── */
function abrirModal() {
  const container = document.getElementById('modal-inputs');
  container.innerHTML = OPERADORES.map(op=>`
    <div class="modal-row">
      <label>${op.nome}</label>
      <input type="number" id="inp-${op.codigo}" value="${metas[op.codigo]||0}" step="10000">
    </div>
  `).join('');
  document.getElementById('modal-metas').classList.add('open');
}
function fecharModal() {
  document.getElementById('modal-metas').classList.remove('open');
}
function salvarMetas() {
  OPERADORES.forEach(op => {
    const v = parseFloat(document.getElementById(`inp-${op.codigo}`).value);
    if(v >= 0) metas[op.codigo] = v;
  });
  savePrefs();
  fecharModal();
  carregar();
}

/* ── Admin ── */
if(new URLSearchParams(window.location.search).get('admin') === '1') {
  document.getElementById('btn-admin').style.display = '';
}

/* ── Init ── */
loadPrefs();
carregar();
setInterval(carregar, 5*60*1000);

document.getElementById('modal-metas').addEventListener('click', function(e){
  if(e.target===this) fecharModal();
});
</script>
</body>
</html>
