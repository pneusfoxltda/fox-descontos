<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Televendas — Fox Pneus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f4f6f9;color:#1a2332;font-family:'Inter',sans-serif;min-height:100vh;}

/* ── Header ── */
.header{background:#0f1f3d;padding:14px 24px;display:flex;align-items:center;gap:12px;}
.logo{width:40px;height:40px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;}
.brand{color:#fff;font-weight:700;font-size:16px;}
.brand small{display:block;font-size:11px;color:#8899bb;font-weight:400;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.sync-info{font-size:11px;color:#8899bb;text-align:right;}
.btn-refresh{background:#1e3a6e;border:none;color:#8fb3ff;font-size:11px;border-radius:6px;padding:6px 12px;cursor:pointer;transition:.15s;}
.btn-refresh:hover{background:#2a4d8f;color:#fff;}

/* ── Container ── */
.container{max-width:1100px;margin:0 auto;padding:20px 16px;}

/* ── Título ── */
.page-header{margin-bottom:16px;}
.page-title{font-size:22px;font-weight:800;color:#0f1f3d;}
.page-title span{color:#CC1F1F;}
.page-meta{font-size:12px;color:#7a8ba0;margin-top:3px;}

/* ── Metas ── */
.metas-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.meta-btn{background:#fff;border:2px solid #dde3ec;border-radius:8px;padding:8px 16px;cursor:pointer;transition:.15s;text-align:center;}
.meta-btn:hover{border-color:#0f1f3d;}
.meta-btn.active{background:#0f1f3d;border-color:#0f1f3d;color:#fff;}
.meta-btn .meta-label{font-size:11px;font-weight:600;opacity:.7;}
.meta-btn .meta-valor{font-size:14px;font-weight:800;}
.meta-btn.active .meta-label{opacity:.8;}

/* ── KPIs ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #e2e8f0;box-shadow:0 1px 3px #0001;}
.kpi-label{font-size:11px;font-weight:600;color:#7a8ba0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.kpi-valor{font-size:22px;font-weight:800;color:#0f1f3d;}
.kpi-valor.vermelho{color:#CC1F1F;}
.kpi-valor.verde{color:#16a34a;}
.kpi-sub{font-size:11px;color:#9aabb8;margin-top:4px;}
.progress-bar{height:6px;background:#e2e8f0;border-radius:3px;margin-top:8px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;background:#CC1F1F;transition:width .6s;}
.progress-fill.verde{background:#16a34a;}

/* ── Tabela ── */
.table-wrap{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 3px #0001;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:#0f1f3d;color:#fff;}
th{padding:15px 12px;font-weight:700;font-size:15px;text-align:center !important;letter-spacing:.3px;vertical-align:middle;}
thead th:first-child{text-align:center !important;}
.th-dias{background:#e85d04;color:#fff;text-align:center;}
thead tr:last-child th{background:#e85d04;color:#fff;font-size:13px;padding:8px 12px;}
tbody tr{border-bottom:1px solid #f0f4f8;transition:.1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#f8fafc;}
tbody tr.total-row{font-weight:700;}
tbody tr.row-verde{background:#bbf7d0;}
tbody tr.row-verde:hover{background:#a7f3d0 !important;}
tbody tr.row-vermelho{background:#fecaca;}
tbody tr.row-vermelho:hover{background:#fca5a5 !important;}
tbody tr.total-row.row-verde{background:#bbf7d0 !important;}
tbody tr.total-row.row-vermelho{background:#fecaca !important;}
td{padding:11px 12px;text-align:center;color:#1a2332;}
td:first-child{text-align:left;font-weight:700;}
td.verde{color:#16a34a;font-weight:700;}
td.vermelho{color:#CC1F1F;font-weight:700;}
td.dia-col{color:#374151;font-size:12px;}
td.meta-col{color:#6b7280;}

/* ── Badge % ── */
.pct-badge{display:inline-block;padding:3px 8px;border-radius:5px;font-size:12px;font-weight:700;}
.pct-badge.verde{background:#dcfce7;color:#16a34a;}
.pct-badge.amarelo{background:#fef9c3;color:#b45309;}
.pct-badge.vermelho{background:#fee2e2;color:#CC1F1F;}

/* ── Filtro de data ── */
.filtro-data-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.filtro-data-label{font-size:12px;font-weight:600;color:#7a8ba0;text-transform:uppercase;letter-spacing:.4px;}
.filtro-data-btn{background:#fff;border:2px solid #dde3ec;border-radius:8px;padding:8px 14px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:#0f1f3d;display:flex;align-items:center;gap:8px;transition:.15s;}
.filtro-data-btn:hover{border-color:#0f1f3d;}
.filtro-data-btn.ativo{border-color:#CC1F1F;color:#CC1F1F;}
.filtro-data-clear{background:none;border:none;cursor:pointer;font-size:11px;color:#9aabb8;padding:4px 6px;border-radius:4px;}
.filtro-data-clear:hover{color:#CC1F1F;}

/* ── Calendário popup ── */
.cal-popup{display:none;position:absolute;z-index:200;background:#fff;border:1px solid #dde3ec;border-radius:12px;box-shadow:0 8px 32px #0002;padding:16px;min-width:280px;}
.cal-mes-btn{background:#f0f4f8;border-radius:7px;padding:9px 12px;font-size:12px;font-weight:700;color:#0f1f3d;cursor:pointer;margin-bottom:12px;text-align:center;transition:.15s;border:none;width:100%;display:block;}
.cal-mes-btn:hover{background:#0f1f3d;color:#fff;}
.cal-popup.aberto{display:block;}
.cal-popup-wrap{position:relative;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav{background:none;border:1px solid #dde3ec;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:14px;color:#0f1f3d;display:flex;align-items:center;justify-content:center;transition:.1s;}
.cal-nav:hover{background:#0f1f3d;color:#fff;}
.cal-nav:disabled{opacity:.3;cursor:not-allowed;}
.cal-titulo{font-size:14px;font-weight:700;color:#0f1f3d;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dow{font-size:10px;font-weight:700;color:#9aabb8;text-align:center;padding:4px 0;text-transform:uppercase;}
.cal-dia{font-size:13px;font-weight:500;color:#1a2332;text-align:center;padding:7px 4px;border-radius:6px;cursor:pointer;transition:.1s;}
.cal-dia:hover:not(.cal-dia-vazio):not(.cal-dia-disabled){background:#e8f0fe;color:#0f1f3d;}
.cal-dia.cal-dia-hoje{font-weight:800;color:#CC1F1F;}
.cal-dia.cal-dia-sel{background:#0f1f3d;color:#fff !important;font-weight:700;}
.cal-dia.cal-dia-disabled{color:#d1d5db;cursor:not-allowed;pointer-events:none;}
.cal-dia.cal-dia-vazio{cursor:default;}
.cal-dia-futuros{font-size:10px;color:#9aabb8;text-align:center;margin-top:8px;}

/* ── Legenda ── */
.legenda{display:flex;gap:20px;padding:10px 12px;background:#f8fafc;font-size:11px;color:#7a8ba0;border-top:1px solid #e2e8f0;}
.leg-item{display:flex;align-items:center;gap:5px;}
.leg-dot{width:8px;height:8px;border-radius:50%;}

/* ── Loading / Error ── */
.loading{text-align:center;padding:60px;color:#9aabb8;}
.spinner{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#CC1F1F;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.erro{background:#fff5f5;border:1px solid #fca5a5;border-radius:10px;padding:16px;color:#CC1F1F;font-size:13px;text-align:center;}

/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:14px;padding:24px;width:480px;box-shadow:0 20px 60px #0003;}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px;color:#0f1f3d;}
.modal-grid{display:grid;gap:10px;margin-bottom:16px;}
.modal-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.modal-row label{font-size:13px;color:#374151;flex:1;}
.modal-row input{width:130px;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:14px;text-align:right;}
.modal-row input:focus{outline:none;border-color:#0f1f3d;}
.modal-btns{display:flex;gap:10px;}
.modal-btns button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-ok{background:#0f1f3d;color:#fff;}
.btn-cancel{background:#f1f5f9;color:#374151;}
.btn-editar-meta{background:none;border:1px solid #d1d5db;border-radius:6px;color:#6b7280;font-size:11px;padding:5px 10px;cursor:pointer;margin-left:8px;}
.btn-editar-meta:hover{border-color:#0f1f3d;color:#0f1f3d;}

/* ── Modal feriados ── */
.modal-section-title{font-size:11px;font-weight:700;color:#7a8ba0;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;}
.modal-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
.modal-cal-dow{font-size:9px;font-weight:700;color:#9aabb8;text-align:center;padding:4px 0;text-transform:uppercase;}
.modal-cal-dia{font-size:12px;text-align:center;padding:6px 3px;border-radius:5px;line-height:1;}
.modal-cal-dia.util{cursor:pointer;background:#f0f4f8;color:#1a2332;font-weight:600;}
.modal-cal-dia.util:hover{background:#dde6f5;}
.modal-cal-dia.feriado{background:#fee2e2;color:#CC1F1F;font-weight:700;cursor:pointer;}
.modal-cal-dia.dom{color:#d1d5db;font-size:11px;}
.modal-cal-dia.vazio{background:none;}
.modal-du-info{font-size:11px;color:#7a8ba0;margin-top:4px;margin-bottom:16px;}

/* ── Scroll hint (mobile) ── */
.scroll-hint{display:none;text-align:center;font-size:11px;color:#9aabb8;padding:6px 0 2px;letter-spacing:.3px;}

@media(max-width:768px){
  /* Header compacto */
  .header{padding:10px 14px;}
  .brand{font-size:14px;}
  .brand small{display:none;}
  .sync-info{display:none;}
  .btn-refresh{padding:5px 10px;font-size:10px;}

  /* Container */
  .container{padding:12px 10px;}

  /* Título */
  .page-title{font-size:17px;}
  .page-meta{font-size:11px;}

  /* Metas */
  .metas-row{gap:6px;}
  .meta-btn{padding:6px 12px;}
  .meta-btn .meta-valor{font-size:12px;}

  /* KPIs — 2 colunas */
  .kpis{grid-template-columns:1fr 1fr;gap:8px;}
  .kpi{padding:10px 12px;}
  .kpi-valor{font-size:18px;}
  .kpi-label{font-size:10px;}

  /* Tabela — scroll horizontal */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px;}
  .scroll-hint{display:block;}
  table{font-size:11px;min-width:620px;}
  th{font-size:12px !important;padding:10px 8px !important;}
  td{padding:9px 8px;font-size:11px;}
  td:first-child{font-size:13px !important;}
  .pct-badge{font-size:11px;padding:3px 7px;}

  /* Legenda empilha */
  .legenda{flex-direction:column;gap:6px;}

  /* Modal full width */
  .modal{width:calc(100vw - 32px);padding:18px;}
}
</style>
</head>

<script>
/* ── Data de referência (filtro) ── */
const DATA_MIN = new Date(2026, 9, 1); // 01/10/2026
let dataRef = null; // null = hoje; Date = data selecionada
let calViewAno, calViewMes;

function dataRefAtiva() {
  return dataRef || new Date();
}

function toggleCalendario() {
  const popup = document.getElementById('cal-popup');
  const d = dataRefAtiva();
  calViewAno = d.getFullYear();
  calViewMes = d.getMonth();
  renderCalendario();
  popup.classList.toggle('aberto');
  // fechar ao clicar fora
  if(popup.classList.contains('aberto')) {
    setTimeout(() => document.addEventListener('click', fecharCalFora, {once:true}), 10);
  }
}

function fecharCalFora(e) {
  const wrap = document.querySelector('.cal-popup-wrap');
  if(wrap && !wrap.contains(e.target)) {
    document.getElementById('cal-popup').classList.remove('aberto');
  } else {
    document.addEventListener('click', fecharCalFora, {once:true});
  }
}

function calNav(dir) {
  calViewMes += dir;
  if(calViewMes > 11) { calViewMes = 0; calViewAno++; }
  if(calViewMes < 0)  { calViewMes = 11; calViewAno--; }
  renderCalendario();
}

function renderCalendario() {
  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DIAS_SEM = ['Do','Se','Te','Qu','Qu','Se','Sá'];
  const hoje = new Date();
  const selD = dataRef;

  document.getElementById('cal-titulo').textContent = `${MESES[calViewMes]} ${calViewAno}`;

  // Botões prev/next
  const minAno = DATA_MIN.getFullYear(), minMes = DATA_MIN.getMonth();
  document.getElementById('cal-prev').disabled = (calViewAno < minAno || (calViewAno === minAno && calViewMes <= minMes));
  document.getElementById('cal-next').disabled = (calViewAno > hoje.getFullYear() || (calViewAno === hoje.getFullYear() && calViewMes >= hoje.getMonth()));

  let html = DIAS_SEM.map(d=>`<div class="cal-dow">${d}</div>`).join('');

  const primeiro = new Date(calViewAno, calViewMes, 1).getDay(); // 0=Dom
  for(let i=0; i<primeiro; i++) html += `<div class="cal-dia cal-dia-vazio"></div>`;

  const totalDias = new Date(calViewAno, calViewMes+1, 0).getDate();
  for(let d=1; d<=totalDias; d++) {
    const dataDia = new Date(calViewAno, calViewMes, d);
    const isMin = dataDia < DATA_MIN;
    const isFuturo = dataDia > hoje;
    const isHoje = d===hoje.getDate() && calViewMes===hoje.getMonth() && calViewAno===hoje.getFullYear();
    const isSel = selD && d===selD.getDate() && calViewMes===selD.getMonth() && calViewAno===selD.getFullYear();
    let cls = 'cal-dia';
    if(isMin || isFuturo) cls += ' cal-dia-disabled';
    if(isHoje) cls += ' cal-dia-hoje';
    if(isSel) cls += ' cal-dia-sel';
    html += `<div class="${cls}" onclick="selecionarData(${d},${calViewMes},${calViewAno})">${d}</div>`;
  }

  document.getElementById('cal-grid').innerHTML = html;
  document.getElementById('cal-futuros').textContent =
    (calViewAno < hoje.getFullYear() || calViewMes < hoje.getMonth()) ? '' : 'Datas futuras não disponíveis';
}

function selecionarData(dia, mes, ano) {
  dataRef = new Date(ano, mes, dia);
  atualizarBotaoFiltro();
  document.getElementById('cal-popup').classList.remove('aberto');
  carregar(true);
}

function verMesCompleto() {
  dataRef = null;
  atualizarBotaoFiltro();
  document.getElementById('cal-popup').classList.remove('aberto');
  carregar(true);
}

function limparFiltro() {
  dataRef = null;
  atualizarBotaoFiltro();
  carregar(true);
}

function atualizarBotaoFiltro() {
  const btn = document.getElementById('filtro-data-btn');
  const txt = document.getElementById('filtro-data-txt');
  const clear = document.getElementById('filtro-data-clear');
  if(dataRef) {
    txt.textContent = dataRef.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    btn.classList.add('ativo');
    clear.style.display = 'inline-flex';
  } else {
    txt.textContent = 'Mês';
    btn.classList.remove('ativo');
    clear.style.display = 'none';
  }
}

/* ── Metas padrão ── */
const METAS_DEFAULT = {
  "294862": 480000,
  "299497": 480000,

};

let metas = {...METAS_DEFAULT};

let feriados = {}; // { "YYYY-MM": [dia, dia, ...] }
const META_MULT = [1, 1.1, 1.2];

function loadPrefs() {
  try {
    const m = localStorage.getItem('fox_tv_metas');
    if (m) metas = {...METAS_DEFAULT, ...JSON.parse(m)};
    const mi = localStorage.getItem('fox_tv_meta_idx');
    if (mi !== null) metaIdx = parseInt(mi);
    const f = localStorage.getItem('fox_tv_feriados');
    if (f) feriados = JSON.parse(f);
  } catch(e){}
}

function savePrefs() {
  try {
    localStorage.setItem('fox_tv_metas', JSON.stringify(metas));
    localStorage.setItem('fox_tv_meta_idx', metaIdx);
    localStorage.setItem('fox_tv_feriados', JSON.stringify(feriados));
  } catch(e){}
}

function metaTotal(mult) {
  return Object.values(metas).reduce((a,b)=>a+b,0) * mult;
}

function metaOp(codigo, mult) {
  return (metas[codigo] || 0) * mult;
}

/* ── Formatação ── */
function brl(v, dec=0) {
  return 'R$ ' + (v||0).toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function pct(v) { return Math.round(v||0) + '%'; }
function dataBR(iso) {
  const [,m,d] = iso.split('-');
  return `${d}/${m}`;
}

/* ── Dias úteis (seg–sáb, excluindo feriados) ── */
function diasUteis(ano, mes) {
  // 1-indexed mes; exclui feriados marcados no admin
  const total = new Date(ano, mes, 0).getDate();
  const key = `${ano}-${String(mes).padStart(2,'0')}`;
  const ferDia = new Set(feriados[key] || []);
  let dias = [];
  for(let d=1; d<=total; d++) {
    const dow = new Date(ano, mes-1, d).getDay();
    if(dow >= 1 && dow <= 6 && !ferDia.has(d)) dias.push(d);
  }
  return dias;
}

function diasUteisPassados(ano, mes, hoje) {
  return diasUteis(ano, mes).filter(d => d <= hoje).length;
}

/* ── Busca Supabase ── */
async function buscarMes() {
  const agora = dataRefAtiva();
  const ano = agora.getFullYear();
  const mes = String(agora.getMonth()+1).padStart(2,'0');
  const ini = `${ano}-${mes}-01`;
  const fim = `${ano}-${mes}-31`;

  const url = `${SB_URL}/rest/v1/vendas_televendas?data_ref=gte.${ini}&data_ref=lte.${fim}&order=data_ref.asc`;
  const r = await fetch(url, {headers:{apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`}});
  if(!r.ok) throw new Error(`Supabase ${r.status}`);
  return r.json();
}

/* ── Render dia específico (visão simplificada) ── */

          <th style="padding:14px 16px;text-align:left;font-size:14px;">Vendedor</th>

        </tr>
      </thead>

/* ── Render ── */
function render(rows) {
  // Se há data específica selecionada → visão simplificada do dia
  if(dataRef) {
    renderDia(rows);
    return;
  }

  // Restaurar elementos que podem ter sido ocultados
  document.getElementById('metas-row').style.display = '';

  const agora = dataRefAtiva();
  const hoje = new Date();
  const ano = agora.getFullYear();
  const mes = agora.getMonth()+1;
  // Se mês selecionado é passado, usa último dia do mês; senão usa dia da data ref
  const mesCompleto = (ano < hoje.getFullYear()) || (ano === hoje.getFullYear() && mes < hoje.getMonth()+1);
  const diaHoje = mesCompleto ? new Date(ano, mes, 0).getDate() : agora.getDate();

  const duTotal = diasUteis(ano, mes).length;
  const duPassados = diasUteisPassados(ano, mes, diaHoje);
  const pctDesejado = duTotal > 0 ? Math.round(duPassados / duTotal * 100) : 0;

  const mult = META_MULT[metaIdx];
  const metaSetorTotal = metaTotal(mult);

  // Botões de meta
  META_MULT.forEach((m,i) => {
    const label = i===0 ? 'Meta 1' : `Meta ${i+1} (+${Math.round((m-1)*100)}%)`;
    document.getElementById(`meta-btn-val-${i}`).textContent = brl(metaTotal(m));
    document.getElementById(`meta-btn-${i}`).classList.toggle('active', i===metaIdx);
  });

  // Agrupar por operador e por data
  const porOp = {}; // codigo → {totalMes, porDia:{iso→valor}}
  const datasSet = new Set();

  OPERADORES.forEach(op => {
    porOp[op.codigo] = {nome: op.nome, totalMes: 0, porDia: {}};
  });

  rows.forEach(r => {
    if(!porOp[r.operador_codigo]) return;
    porOp[r.operador_codigo].totalMes += r.valor_venda || 0;
    porOp[r.operador_codigo].porDia[r.data_ref] = (porOp[r.operador_codigo].porDia[r.data_ref]||0) + (r.valor_venda||0);
    datasSet.add(r.data_ref);
  });

  // Últimas 5 datas com dados
  const datas5 = Array.from(datasSet).sort().slice(-5);

  // Totais do setor
  const totalMes = Object.values(porOp).reduce((a,op)=>a+op.totalMes,0);
  const pctMeta = metaSetorTotal > 0 ? totalMes / metaSetorTotal * 100 : 0;
  const faltaMeta = Math.max(0, metaSetorTotal - totalMes);
  const duRestantes = Math.max(1, duTotal - duPassados);
  const precisaPorDia = faltaMeta / duRestantes;

  // Data última sync
  const ultSyncRows = rows.filter(r=>r.atualizado_em);
  const ultSync = ultSyncRows.length > 0
    ? new Date(ultSyncRows[ultSyncRows.length-1].atualizado_em)
        .toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'})
    : null;

  // page-meta
  const ultimaDia = datas5.length > 0 ? dataBR(datas5[datas5.length-1]) : '—';
  document.getElementById('page-meta').textContent =
    `Vendas até ${ultimaDia} · ${ultSync ? 'atualizado em ' + ultSync : 'aguardando sincronização'} · fonte: Movere`;

  atualizarSyncInfo(calcularIntervalo());

  // KPIs
  const kpiBar = Math.min(pctMeta, 100);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi">
      <div class="kpi-label">Faturamento do setor</div>
      <div class="kpi-valor">${brl(totalMes)}</div>
      <div class="kpi-sub">meta ${brl(metaSetorTotal)}</div>
      <div class="progress-bar"><div class="progress-fill ${pctMeta>=pctDesejado?'verde':''}" style="width:${kpiBar}%"></div></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">% da meta</div>
      <div class="kpi-valor ${pctMeta>=pctDesejado?'verde':'vermelho'}">${pct(pctMeta)}</div>
      <div class="kpi-sub">desejado: ${pct(pctDesejado)}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">% desejado do dia</div>
      <div class="kpi-valor">${pct(pctDesejado)}</div>
      <div class="kpi-sub">${duPassados} de ${duTotal} dias úteis</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Falta para a meta</div>
      <div class="kpi-valor vermelho">${brl(faltaMeta)}</div>
      <div class="kpi-sub">${duRestantes} dia${duRestantes!==1?'s':''} útil${duRestantes!==1?'s':''} restante${duRestantes!==1?'s':''}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Setor precisa por dia</div>
      <div class="kpi-valor">${brl(precisaPorDia)}</div>
      <div class="kpi-sub">meta diária original ${brl(metaSetorTotal/duTotal)}</div>
    </div>
  `;

  // Tabela
  if(rows.length === 0) {
    document.getElementById('tabela-wrap').innerHTML =
      `<div class="erro" style="margin-top:16px">Sem dados para este mês ainda.<br><small>Execute o script sync_televendas.py para sincronizar.</small></div>`;
    return;
  }

  // Ordenar operadores por % atingido desc
  const opsOrdenadas = OPERADORES.map(op => {
    const data = porOp[op.codigo];
    const metaOp2 = metaOp(op.codigo, mult);
    const pctOp = metaOp2 > 0 ? data.totalMes / metaOp2 * 100 : 0;
    const faltaOp = Math.max(0, metaOp2 - data.totalMes);
    const precisaOp = faltaOp / duRestantes;
    return {...op, ...data, metaOp: metaOp2, pctOp, faltaOp, precisaOp};
  }).sort((a,b)=>b.pctOp-a.pctOp);

  const colDias = datas5.map(d=>`<th class="th-dias">${dataBR(d)}</th>`).join('');
  const colDiasTotals = datas5.map(d=>{
    const tot = OPERADORES.reduce((a,op)=>{
      return a + (porOp[op.codigo]?.porDia?.[d]||0);
    },0);
    return `<td class="dia-col">${brl(tot)}</td>`;
  }).join('');

  const linhas = opsOrdenadas.map(op => {
    const onTarget = op.pctOp >= pctDesejado;
    const rowClass = onTarget ? 'row-verde' : 'row-vermelho';
    const badge = onTarget ? 'verde' : (op.pctOp >= pctDesejado*0.7 ? 'amarelo' : 'vermelho');
    const diasCols = datas5.map(d=>
      `<td class="dia-col" style="font-size:13px">${op.porDia[d] ? brl(op.porDia[d]) : '—'}</td>`
    ).join('');
    return `
    <tr class="${rowClass}">
      <td style="font-size:16px;font-weight:800;color:#1a2332">${op.nome.toUpperCase()}</td>
      <td class="meta-col" style="font-size:15px;font-weight:700">${brl(op.metaOp)}</td>
      ${diasCols}
      <td style="font-size:15px;font-weight:700;color:#1a2332">${brl(op.totalMes)}</td>
      <td style="font-size:13px;font-weight:600;color:#1a2332">${brl(op.precisaOp)}</td>
      <td style="text-align:center"><span class="pct-badge ${badge}" style="font-size:14px;padding:5px 12px">${pct(op.pctOp)}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('tabela-wrap').innerHTML = `
  <div class="table-wrap" style="margin-top:16px;">
    <table>
      <thead>
        <tr>
          <th rowspan="2" style="border-right:1px solid rgba(255,255,255,0.15)">Operadora</th>
          <th rowspan="2" style="border-right:1px solid rgba(255,255,255,0.15)">Meta</th>
          <th colspan="${datas5.length}" class="th-dias">Últimos ${datas5.length} dias úteis</th>
          <th rowspan="2" style="border-left:1px solid rgba(255,255,255,0.15);border-right:1px solid rgba(255,255,255,0.15)">Faturamento<br>do mês</th>
          <th rowspan="2" style="border-right:1px solid rgba(255,255,255,0.15)">Precisa por dia<br>(${duRestantes} dias)</th>
          <th rowspan="2">% atingido</th>
        </tr>
        <tr>
          ${colDias}
        </tr>
      </thead>
      <tbody>
        ${linhas}
        <tr class="total-row ${pctMeta>=pctDesejado?'row-verde':'row-vermelho'}">
          <td style="font-size:16px;font-weight:800;color:#1a2332">TOTAL SETOR</td>
          <td class="meta-col">${brl(metaSetorTotal)}</td>
          ${colDiasTotals}
          <td>${brl(totalMes)}</td>
          <td>${brl(precisaPorDia)}</td>
          <td><span class="pct-badge ${pctMeta>=pctDesejado?'verde':'vermelho'}">${pct(pctMeta)}</span></td>
        </tr>
      </tbody>
    </table>
    <div class="legenda">
      <div class="leg-item"><span class="leg-dot" style="background:#16a34a"></span> No ritmo (% atingido ≥ % desejado do dia)</div>
      <div class="leg-item"><span class="leg-dot" style="background:#CC1F1F"></span> Abaixo do ritmo</div>
      <span style="margin-left:auto">Ordenado pelo maior % atingido</span>
    </div>
  </div>`;
}

/* ── Carregar ── */
async function carregar(forcar=false) {
  try {
    const rows = await buscarMes();
    render(rows);
    updateMetaBtns();
  } catch(e) {
    document.getElementById('kpis').innerHTML = `<div class="erro">Erro ao carregar: ${e.message}</div>`;
  }
}

function updateMetaBtns() {
  META_MULT.forEach((m,i) => {
    document.getElementById(`meta-btn-val-${i}`).textContent = brl(metaTotal(m));
    document.getElementById(`meta-btn-${i}`).classList.toggle('active', i===metaIdx);
  });
}

function setMeta(idx) {
  metaIdx = idx;
  savePrefs();
  carregar();
}

/* ── Feriados helpers ── */
function getFeriados(ano, mes) {
  const key = `${ano}-${String(mes).padStart(2,'0')}`;
  return new Set(feriados[key] || []);
}

function toggleFeriado(ano, mes, dia) {
  const key = `${ano}-${String(mes).padStart(2,'0')}`;
  if(!feriados[key]) feriados[key] = [];
  const idx = feriados[key].indexOf(dia);
  if(idx >= 0) feriados[key].splice(idx, 1);
  else feriados[key].push(dia);
  savePrefs();
  renderCalFeriados(ano, mes);
}

function renderCalFeriados(ano, mes) {
  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('modal-mes-label').textContent = `${MESES[mes-1]} ${ano}`;

  const ferDia = getFeriados(ano, mes);
  const totalDias = new Date(ano, mes, 0).getDate();
  const primeiroDow = new Date(ano, mes-1, 1).getDay();
  const DOW = ['Do','Se','Te','Qu','Qu','Se','Sá'];

  let html = DOW.map(d => `<div class="modal-cal-dow">${d}</div>`).join('');
  for(let i=0; i<primeiroDow; i++) html += `<div class="modal-cal-dia vazio"></div>`;
  for(let d=1; d<=totalDias; d++) {
    const dow = new Date(ano, mes-1, d).getDay();
    const isUtil = dow >= 1 && dow <= 6;
    const isFeriado = ferDia.has(d);
    let cls = 'modal-cal-dia';
    let onclick = '';
    if(isUtil) {
      cls += isFeriado ? ' feriado' : ' util';
      onclick = `onclick="toggleFeriado(${ano},${mes},${d})"`;
    } else {
      cls += ' dom';
    }
    html += `<div class="${cls}" ${onclick}>${d}</div>`;
  }
  document.getElementById('modal-cal-feriados').innerHTML = html;

  const duTotal = diasUteis(ano, mes).length;
  document.getElementById('modal-du-label').textContent = `— ${duTotal} dia${duTotal!==1?'s':''} útil${duTotal!==1?'s':''}`;
  document.getElementById('modal-du-info').textContent =
    `${duTotal} dias úteis em ${MESES[mes-1]} (seg–sáb${ferDia.size > 0 ? `, excluindo ${ferDia.size} feriado${ferDia.size>1?'s':''}` : ''})`;
}

/* ── Modal ── */
function abrirModal() {
  const agora = dataRefAtiva();
  const ano = agora.getFullYear();
  const mes = agora.getMonth() + 1;
  const container = document.getElementById('modal-inputs');
  container.innerHTML = OPERADORES.map(op=>`
    <div class="modal-row">
      <label>${op.nome}</label>
      <input type="number" id="inp-${op.codigo}" value="${metas[op.codigo]||0}" step="10000">
    </div>
  `).join('');
  renderCalFeriados(ano, mes);
  document.getElementById('modal-metas').classList.add('open');
}
function fecharModal() {
  document.getElementById('modal-metas').classList.remove('open');
}
function salvarMetas() {
  OPERADORES.forEach(op => {
    const v = parseFloat(document.getElementById(`inp-${op.codigo}`).value);
    if(v >= 0) metas[op.codigo] = v;
  });
  savePrefs();
  fecharModal();
  carregar();
}

/* ── Auto-atualização dinâmica ── */
let timerAuto = null;

function calcularIntervalo() {
  const agora = new Date();
  const dia = agora.getDay(); // 0=Dom, 1=Seg … 6=Sáb
  const hora = agora.getHours();
  const min = agora.getMinutes();
  const minTotal = hora * 60 + min;

  // Domingo → 1 hora
  if(dia === 0) return 60 * 60 * 1000;
  // Seg–Sáb 18h30–00h00 ou madrugada antes das 7h → 30 min
  if(minTotal >= 18 * 60 + 30 || hora < 7) return 30 * 60 * 1000;
  // Seg–Sáb 7h–18h30 → 5 min
  return 5 * 60 * 1000;
}

function agendarAtualizacao() {
  if(timerAuto) clearTimeout(timerAuto);
  const intervalo = calcularIntervalo();
  timerAuto = setTimeout(async () => {
    try { await carregar(false); } catch(e) { console.warn('Auto-refresh erro:', e); }
    agendarAtualizacao(); // reagenda sempre, mesmo em caso de erro
  }, intervalo);
  atualizarSyncInfo(intervalo);
}

function atualizarSyncInfo(intervalo) {
  const el = document.getElementById('sync-info');
  if(!el) return;
  const minutos = Math.round(intervalo / 60000);
  const proxima = new Date(Date.now() + intervalo);
  const hhmm = proxima.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const label = minutos >= 60 ? `${Math.round(minutos/60)}h` : `${minutos} min`;
  el.innerHTML = `Atualiza a cada ${label} · próxima às ${hhmm}<br><small style="color:#556">Fonte: Movere ERP</small>`;
}

/* ── Init ── */
loadPrefs();
carregar();
agendarAtualizacao();

document.getElementById('modal-metas').addEventListener('click', function(e){
  if(e.target===this) fecharModal();
});
