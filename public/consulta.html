<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fox Pneus — Consulta de Descontos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0D0D0D;color:#F0F0F0;font-family:'Inter',sans-serif;min-height:100vh;}

.header{background:#111;border-bottom:1px solid #1E1E1E;padding:14px 20px;display:flex;align-items:center;gap:12px;}
.logo-circle{width:40px;height:40px;background:#CC1F1F;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:2px;color:#fff;}
.brand-sub{font-size:11px;color:#555;margin-top:1px;}
.header a{margin-left:auto;font-size:12px;color:#555;text-decoration:none;border:1px solid #2A2A2A;border-radius:6px;padding:7px 14px;transition:all .15s;white-space:nowrap;}
.header a:hover{border-color:#CC1F1F;color:#CC1F1F;}

.container{max-width:700px;margin:0 auto;padding:30px 16px;}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:#fff;margin-bottom:4px;}
.page-sub{font-size:13px;color:#666;margin-bottom:24px;}

.search-card{background:#161616;border:1px solid #2A2A2A;border-radius:12px;padding:20px;margin-bottom:22px;}
.search-tabs{display:flex;gap:0;margin-bottom:16px;border-radius:8px;overflow:hidden;border:1px solid #2A2A2A;}
.stab{flex:1;padding:11px;background:#0D0D0D;color:#666;border:none;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.stab.active{background:#CC1F1F22;color:#CC1F1F;}
.search-row{display:flex;gap:10px;}
.search-row input{flex:1;background:#0D0D0D;border:1px solid #2A2A2A;border-radius:8px;color:#F0F0F0;font-family:'Inter',sans-serif;font-size:15px;padding:13px 16px;outline:none;transition:border-color .15s;}
.search-row input:focus{border-color:#CC1F1F;}
.search-row input::placeholder{color:#444;}
.btn-search{background:#CC1F1F;color:#fff;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:13px 22px;cursor:pointer;transition:background .15s;white-space:nowrap;}
.btn-search:hover{background:#E02020;}
.btn-search:disabled{background:#4A1A1A;color:#666;cursor:default;}
.search-hint{font-size:12px;color:#444;margin-top:9px;}

.state-empty{text-align:center;padding:56px 20px;color:#444;}
.state-empty .icon{font-size:44px;opacity:.3;margin-bottom:12px;}
.state-empty p{font-size:14px;}
.state-nf{text-align:center;padding:48px 20px;}
.state-nf .icon{font-size:38px;margin-bottom:10px;}
.state-nf h3{font-size:16px;color:#888;margin-bottom:6px;}
.state-nf p{font-size:13px;color:#555;}
.loading{text-align:center;padding:40px;color:#666;font-size:14px;}

.result-header{display:flex;align-items:center;margin-bottom:14px;}
.result-count{font-size:13px;color:#666;}
.result-count span{color:#fff;font-weight:700;}

.quote-card{background:#161616;border:1px solid #2A2A2A;border-radius:12px;margin-bottom:14px;overflow:hidden;transition:border-color .15s;}
.quote-top{padding:15px 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.quote-num{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:#CC1F1F;}
.quote-tipo{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.badge{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;white-space:nowrap;}
.badge-lib{background:#0F2D1A;color:#27AE60;border:1px solid #1A5C32;}
.badge-pend{background:#2A2000;color:#F39C12;border:1px solid #5C4000;}
.badge-venc{background:#2E1A1A;color:#CC1F1F;border:1px solid #4A2E2E;}

.quote-body{padding:0 18px 18px;}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;}
.ii label{display:block;font-size:10px;font-weight:700;color:#555;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.ii .val{font-size:14px;color:#F0F0F0;font-weight:500;}
.ii .val.big{font-size:22px;font-weight:700;color:#27AE60;}
.ii .val.blue{color:#3498DB;}
.ii .val.dim{color:#555;}

.divider{height:1px;background:#1E1E1E;margin:14px 0;}
.motivo-box{background:#0D0D0D;border:1px solid #1E1E1E;border-radius:8px;padding:12px 14px;}
.motivo-box label{display:block;font-size:10px;font-weight:700;color:#555;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.motivo-box p{font-size:13px;color:#aaa;line-height:1.6;white-space:pre-wrap;}

.loja-bar{background:#111;border-top:1px solid #1E1E1E;padding:10px 18px;font-size:12px;color:#555;}
.loja-bar span{color:#888;}

@media(max-width:500px){.search-row{flex-direction:column;}.info-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<div class="header">
  <div class="logo-circle">🦊</div>
  <div>
    <div class="brand-name">FOX PNEUS</div>
    <div class="brand-sub">Consulta de Descontos — Loja</div>
  </div>
  <a href="/">← Sistema completo</a>
</div>

<div class="container">
  <p class="page-title">Consultar Desconto</p>
  <p class="page-sub">Busque pelo número do orçamento/O.S. ou pelo telefone do cliente para ver os detalhes da negociação.</p>

  <div class="search-card">
    <div class="search-tabs">
      <button class="stab active" id="tab-num" onclick="setTab('num')">🔢 Nº do Orçamento / O.S.</button>
      <button class="stab" id="tab-tel" onclick="setTab('tel')">📱 Telefone do Cliente</button>
    </div>
    <div class="search-row">
      <input type="text" id="sinput" placeholder="Digite o número do orçamento..."
        autocomplete="off" onkeydown="if(event.key==='Enter')buscar()">
      <button class="btn-search" id="sbtn" onclick="buscar()">Buscar</button>
    </div>
    <p class="search-hint" id="shint">Ex: 000123 — busca pelo número exato ou parcial</p>
  </div>

  <div id="resultado">
    <div class="state-empty">
      <div class="icon">🔍</div>
      <p>Digite um número ou telefone acima para consultar</p>
    </div>
  </div>
</div>

<script>
const URL = "https://dxwkiaxpygibzmwzvcuz.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4d2tpYXhweWdpYnptd3p2Y3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTE3NzcsImV4cCI6MjA5Mjg4Nzc3N30.mVbUlLaRCI5OMf539Ehjt-XpfAY-wjr7_WCzPsgVvp0";
const H = {"apikey":KEY,"Authorization":"Bearer "+KEY};

let tab = "num";

function setTab(t) {
  tab = t;
  document.getElementById("tab-num").classList.toggle("active", t==="num");
  document.getElementById("tab-tel").classList.toggle("active", t==="tel");
  const inp = document.getElementById("sinput");
  const hint = document.getElementById("shint");
  if (t === "num") {
    inp.placeholder = "Digite o número do orçamento...";
    inp.type = "text";
    hint.textContent = "Ex: 000123 — busca pelo número exato ou parcial";
  } else {
    inp.placeholder = "(00) 00000-0000 ou só os dígitos";
    inp.type = "tel";
    hint.textContent = "Busca pelo telefone do cliente cadastrado na negociação";
  }
  inp.value = "";
  document.getElementById("resultado").innerHTML = '<div class="state-empty"><div class="icon">🔍</div><p>Digite acima para consultar</p></div>';
  inp.focus();
}

const isExp = v => v ? new Date(v+"T23:59:59") < new Date() : false;
const fmtR = v => parseFloat(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmtD = d => { if(!d)return"—"; try{return new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",timeZone:"America/Sao_Paulo"});}catch{return d.slice(0,10).split("-").reverse().join("/");} };
const fmtV = d => d?d.split("-").reverse().join("/"):"—";
const stripConc = obs => obs?(obs.split("\n\n📊 CONCORRENTES:")[0].split("CONCORRENTES:")[0].trim()):"";
const digitsOnly = s => s.replace(/\D/g,"");

function getBadge(q) {
  if (q.liberado) return {lbl:"✓ Liberado", cls:"badge-lib"};
  if (isExp(q.validade)) return {lbl:"Vencido", cls:"badge-venc"};
  return {lbl:"Pendente liberação", cls:"badge-pend"};
}

function renderCards(list) {
  if (!list || !list.length) return `<div class="state-nf"><div class="icon">😕</div><h3>Nenhum desconto encontrado</h3><p>Verifique o número ou telefone e tente novamente.</p></div>`;

  let h = `<div class="result-header"><div class="result-count"><span>${list.length}</span> negociação(ões) encontrada(s)</div></div>`;

  for (const q of list) {
    const b = getBadge(q);
    const obs = stripConc(q.obs||"");
    h += `<div class="quote-card">
  <div class="quote-top">
    <div>
      <div class="quote-num">#${q.numero||"—"}</div>
      <div class="quote-tipo">${q.tipo==="os"?"Ordem de Serviço":"Orçamento"}</div>
    </div>
    <span class="badge ${b.cls}">${b.lbl}</span>
  </div>
  <div class="quote-body">
    <div class="info-grid">
      <div class="ii"><label>CBA</label><div class="val">${q.cba||"—"}</div></div>
      <div class="ii"><label>Produto — Medida</label><div class="val">${q.medida||"—"}</div></div>
      ${q.telefone_cliente?`<div class="ii"><label>📱 Telefone do Cliente</label><div class="val blue">${q.telefone_cliente}</div></div>`:""}
      <div class="ii"><label>Valor Negociado</label><div class="val big">${fmtR(q.valor)}</div></div>
      <div class="ii"><label>Pagamento / Parcelas</label><div class="val">${q.pgto||"—"}</div></div>
      <div class="ii"><label>Validade</label><div class="val ${isExp(q.validade)?"dim":""}">${fmtV(q.validade)}</div></div>
      <div class="ii"><label>Vendedor</label><div class="val">${q.vendedor||"—"}</div></div>
      <div class="ii"><label>Data do Cadastro</label><div class="val">${fmtD(q.criado_em)}</div></div>
    </div>
    ${obs?`<div class="divider"></div><div class="motivo-box"><label>Motivo / Observações</label><p>${obs}</p></div>`:""}
  </div>
  <div class="loja-bar">🏪 <span>${q.loja||"—"}</span></div>
</div>`;
  }
  return h;
}

async function buscar() {
  const raw = document.getElementById("sinput").value.trim();
  if (!raw) return;
  const btn = document.getElementById("sbtn");
  btn.disabled = true; btn.textContent = "Buscando...";
  document.getElementById("resultado").innerHTML = '<div class="loading">🔄 Aguarde...</div>';

  const SEL = "numero,tipo,cba,medida,loja,valor,pgto,validade,obs,liberado,vendedor,criado_em,telefone_cliente";
  let apiUrl;

  if (tab === "tel") {
    const digits = digitsOnly(raw);
    // Busca flexível: tenta encontrar o número de telefone em qualquer formato
    apiUrl = `${URL}/rest/v1/descontos?or=(telefone_cliente.ilike.*${encodeURIComponent(digits)}*,telefone_cliente.ilike.*${encodeURIComponent(raw)}*)&select=${SEL}&order=criado_em.desc`;
  } else {
    const term = raw.replace(/^#/,"").trim();
    apiUrl = `${URL}/rest/v1/descontos?numero=ilike.*${encodeURIComponent(term)}*&select=${SEL}&order=criado_em.desc`;
  }

  try {
    const r = await fetch(apiUrl, {headers: H});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    document.getElementById("resultado").innerHTML = renderCards(data);
  } catch(e) {
    document.getElementById("resultado").innerHTML = `<div class="state-nf"><div class="icon">⚠️</div><h3>Erro ao buscar</h3><p>Verifique sua conexão e tente novamente.</p></div>`;
  }

  btn.disabled = false; btn.textContent = "Buscar";
}

document.getElementById("sinput").focus();
</script>
</body>
</html>
