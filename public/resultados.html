<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fx-bg,#0D0D0D);color:var(--fx-tx,#EDEDED);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
a{color:var(--fx-intx,#7DB8F0)}
button{font-family:inherit;cursor:pointer}
.tela-centro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{background:var(--fx-s1,#161616);border:1px solid var(--fx-bd,#2E2E2E);border-radius:14px;padding:30px;width:100%;max-width:380px;text-align:center}
.login img{width:56px;margin-bottom:10px}.login h1{font-size:20px;margin-bottom:4px}.login p{font-size:12px;color:var(--fx-tx3,#999);margin-bottom:18px}

.btn{background:var(--fx-ac,#CC1F1F);color:#fff;border:none;border-radius:8px;font-weight:700;padding:11px 16px;font-size:14px}
.btn.cz{background:var(--fx-s2,#262626);border:1px solid var(--fx-bd,#3A3A3A);color:var(--fx-tx2,#ddd);font-size:12px;padding:7px 12px;text-decoration:none;display:inline-block}
.erro{color:var(--fx-ertx,#F87171);font-size:13px;margin:6px 0 10px;min-height:18px}
#app{display:none}
.top{position:sticky;top:0;z-index:10;background:var(--fx-bg,#111);border-bottom:1px solid var(--fx-bd,#222);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{width:32px}.top h1{font-size:17px}.top small{color:var(--fx-tx3,#888);font-size:12px;display:block}
.top .sp{flex:1}
.wrap{max-width:1700px;margin:0 auto;padding:16px}
.abas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.aba{background:var(--fx-s1,#161616);border:1px solid var(--fx-bd,#2E2E2E);color:var(--fx-tx2,#ddd);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;text-decoration:none}
.aba.on{background:var(--fx-ac,#CC1F1F);border-color:var(--fx-ac,#CC1F1F);color:#fff}
.aba.off{opacity:.5;cursor:default}
/* barra única de Resultados (resultados-abas.js) com as cores escuras desta tela */
#abas-resultados a,#abas-resultados span{background:var(--fx-s1,#161616)!important;border-color:var(--fx-bd,#2E2E2E)!important;color:var(--fx-tx2,#ddd)!important}
#abas-resultados a.on{background:var(--fx-ac,#CC1F1F)!important;border-color:var(--fx-ac,#CC1F1F)!important;color:#fff!important}
#abas-resultados{background:var(--fx-bg,#0D0D0D)!important}
.aba small{font-weight:500;font-size:11px;opacity:.8;margin-left:4px}
/* Início: os 4 resultados */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--fx-s1,#161616);border:1px solid var(--fx-bd,#2A2A2A);border-radius:14px;padding:20px;text-decoration:none;color:inherit;display:block;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--fx-ac,#CC1F1F)}
.card .ic{font-size:34px}.card h2{font-size:17px;margin:10px 0 4px}.card p{font-size:12.5px;color:var(--fx-tx3,#999);line-height:1.5}
.card.breve{opacity:.55;cursor:default}.card.breve:hover{transform:none;border-color:var(--fx-bd,#2A2A2A)}
.selo{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--fx-s2,#262626);color:var(--fx-tx2,#bbb)}
/* Varejo */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--fx-s1,#161616);border:1px solid var(--fx-bd,#2A2A2A);border-radius:12px;padding:12px 14px}
.k span{font-size:11.5px;color:var(--fx-tx3,#999);display:block}.k b{display:block;font-size:22px;font-weight:800;margin-top:2px}.k small{font-size:11.5px;color:var(--fx-tx3,#999)}
.k.dest{border-color:var(--fx-ac,#CC1F1F)}
.prog{height:8px;background:var(--fx-s2,#262626);border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:#22C55E}
.sec{background:var(--fx-s1,#141414);border:1px solid var(--fx-bd,#262626);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.sec h2{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.sec .sub{font-size:12px;color:var(--fx-tx3,#888);margin-bottom:10px;line-height:1.45}
.tabw{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--fx-tx3,#888);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:7px 8px;border-bottom:1px solid var(--fx-bd,#2A2A2A);white-space:nowrap}
td{padding:9px 7px;border-bottom:1px solid var(--fx-bd,#1C1C1C);white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.loja{cursor:pointer}tr.loja:hover td{background:var(--fx-s2,#1d1d1d)}
tr.loja td:first-child{font-weight:800;color:var(--fx-tx3,#888)}
tr.loja.aberta td{background:var(--fx-s2,#1d1d1d)}
tr.total td{font-weight:800;border-top:2px solid var(--fx-bd,#333)}
.seta{display:inline-block;transition:transform .2s;color:var(--fx-tx3,#888);margin-right:4px}
tr.aberta .seta{transform:rotate(90deg)}

.mini{height:6px;background:var(--fx-s2,#262626);border-radius:3px;overflow:hidden;width:48px;display:inline-block;vertical-align:middle;margin-left:6px}.mini i{display:block;height:100%;background:#22C55E}
.medalha{font-size:15px}

.faixa.m{background:#14532D;color:#BBF7D0}.faixa.s{background:#1E3A8A;color:#BFDBFE}.faixa.g{background:#78350F;color:#FDE68A}
td.pn{min-width:128px}
.k em{font-style:normal;font-weight:800}.k .pb,.k .faixa{display:inline-block}
.metas .pm{display:flex;gap:4px}.metas .pm input{width:33%;font-size:12px;padding:6px}
.pneu-ic{width:14px;height:14px;vertical-align:-2px;display:inline-block}
.pb{display:inline-block;min-width:46px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:800;font-size:12px}
.pb.vd{background:var(--fx-okbg,#0C2A18);color:var(--fx-oktx,#4ADE80)}.pb.vm{background:var(--fx-erbg,#2A1212);color:var(--fx-ertx,#F87171)}
.mini i.vm,.prog i.vm{background:#EF4444}
.k .vd{color:var(--fx-oktx,#4ADE80)}.k .vm{color:var(--fx-ertx,#F87171)}
.atu{font-size:12px;font-weight:500;color:var(--fx-tx3,#888);margin-left:auto}
.info-bt{background:none;border:none;color:var(--fx-ertx,#F87171);font-size:12.5px;font-weight:700;padding:6px 2px;cursor:pointer}
#info-corpo{display:none;font-size:12px;color:var(--fx-tx3,#999);line-height:1.6;padding:4px 2px 10px}
.cal{display:grid;grid-template-columns:repeat(7,38px);gap:4px;margin:8px 0}
.cal b{font-size:10px;color:var(--fx-tx3,#888);text-align:center}
.cal span{font-size:12px;text-align:center;padding:7px 0;border-radius:6px}
.cal .u{background:var(--fx-s2,#262626);cursor:pointer;font-weight:700}.cal .u:hover{outline:1px solid var(--fx-ac,#CC1F1F)}
.cal .f{background:var(--fx-erbg,#3A1414);color:var(--fx-ertx,#F87171);cursor:pointer;font-weight:800;text-decoration:line-through}
.cal .d{color:var(--fx-tx4,#555)}
.emv{display:block;font-size:10.5px;color:var(--fx-tx3,#888);font-weight:500}
th.pn,td.pn{background:rgba(34,197,94,.06)}
.nota{font-size:11.5px;color:var(--fx-tx3,#888);margin-top:8px;line-height:1.5}
.vazio{padding:30px;text-align:center;color:var(--fx-tx3,#888);font-size:13px}
/* Metas (admin) */
.metas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:10px 0}
.metas label{font-size:12px;color:var(--fx-tx2,#ccc);display:flex;flex-direction:column;gap:4px}
.metas input{background:var(--fx-bg,#0D0D0D);border:1px solid var(--fx-bd,#3A3A3A);border-radius:8px;color:var(--fx-tx0,#fff);font-size:14px;padding:8px 10px}
/* Conferência com o Analytics (seta vermelha) */
.conf-bt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--fx-erbg,#2A1212);border:1px solid #7F1D1D;color:var(--fx-ertx,#FCA5A5);border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:700}
.conf-bt .sv{font-size:20px;transition:transform .2s;color:#EF4444}
.conf-bt.aberto .sv{transform:rotate(180deg)}
.conf-ok{font-size:12.5px;color:var(--fx-oktx,#4ADE80);padding:8px 2px}
#conf-corpo{display:none;margin-top:10px}
.mot{font-size:12px;line-height:1.45;padding:4px 0;border-top:1px dashed var(--fx-bd,#2a2a2a)}
.mot:first-child{border-top:none}
.mot small{color:var(--fx-tx3,#999);display:block}
@media(max-width:700px){.wrap{padding:10px}.top{padding:8px 10px}.k b{font-size:19px}td,th{padding:7px 6px}}
</style>

    <button class="btn cz" id="bt-atualizar" style="display:none">↻ Atualizar</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPA_URL = "https://dxwkiaxpygibzmwzvcuz.supabase.co";
// Chave pública (anon): quem protege os números é o banco (só quem tem login ativo lê; SQL 26).
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4d2tpYXhweWdpYnptd3p2Y3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTE3NzcsImV4cCI6MjA5Mjg4Nzc3N30.mVbUlLaRCI5OMf539Ehjt-XpfAY-wjr7_WCzPsgVvp0";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { storageKey: "foxnet-auth", persistSession: true, autoRefreshToken: true } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmtR = v => "R$ " + Number(v || 0).toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtR0 = v => "R$ " + Math.round(Number(v || 0)).toLocaleString("pt-BR");
const fmtN = v => Math.round(Number(v || 0)).toLocaleString("pt-BR");
const PNEU = '<svg class="pneu-ic" viewBox="0 0 24 24" aria-label="pneu"><circle cx="12" cy="12" r="10.5" fill="#2b2b2b" stroke="#888" stroke-width="1.2"/><circle cx="12" cy="12" r="5.2" fill="#9CA3AF"/><circle cx="12" cy="12" r="2" fill="#4B5563"/><g stroke="#666" stroke-width="1.4"><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></g></svg>';
// Pneus: quantos pneus e em quantas vendas (vazio até o robô ler, ou sem o SQL 27)
const celPneus = (q, n) => q == null ? "" : `<b>${fmtN(q)}</b><small class="emv">em ${fmtN(n)} venda${Number(n) === 1 ? "" : "s"}</small>`;
const fmtD = iso => { if (!iso) return ""; const [a, m, d] = String(iso).slice(0, 10).split("-"); return d + "/" + m; };
const hojePVH = () => new Date().toLocaleDateString("en-CA", {timeZone: "America/Porto_Velho"});
const horaPVH = iso => new Date(iso).toLocaleString("pt-BR", {timeZone: "America/Porto_Velho", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
const LOJAS = ["MATRIZ", "C.AUTO PVH", "ARIQUEMES", "JI-PARANA", "CACOAL", "C.AUTO VLH", "PARINTINS", "XAPURI"];
const NOME_LOJA = {"C.AUTO PVH": "C. Automotivo PVH", "C.AUTO VLH": "C. Automotivo Vilhena", "JI-PARANA": "Ji-Paraná", "PARINTINS": "Parintins (Manaus)", "XAPURI": "Xapuri (Rio Branco)"};
const nomeLoja = l => NOME_LOJA[l] || (l.charAt(0) + l.slice(1).toLowerCase());
let perfil = null, ehAdmin = false, podeMetas = false;

// ── LOGIN (qualquer pessoa com login ativo) ──
async function entrar(sessao) {
  if (!sessao) return;
  const { data: p } = await sb.from("perfis").select("*").eq("id", sessao.user.id).maybeSingle();
  if (!p || !p.ativo) { await sb.auth.signOut(); $("l-erro").textContent = "Seu acesso está desativado ou não existe. Fale com o TI."; return; }
  perfil = p; ehAdmin = (p.funcoes || []).includes("admin");
  // Metas do Varejo: admin e "Gerente de todas as lojas" (Jonathan), igual ao banco (SQL 29, edita_metas_varejo)
  podeMetas = ehAdmin || ((p.papel_ligacoes === "gerente" || !!p.dash_ligacoes) && !p.loja);
  if (ehAdmin && window.FoxTema && FoxTema.admin) try { FoxTema.admin(); } catch (e) {}
  $("login").style.display = "none"; $("app").style.display = "block";
  rota();
}
$("l-entrar").onclick = async () => {
  $("l-erro").textContent = "";
  const cred = {email: $("l-email").value.trim().toLowerCase(), password: $("l-senha").value};
  const { data, error } = await (window.FoxLogin ? FoxLogin.entrar(sb, cred) : sb.auth.signInWithPassword(cred));
  if (error) { $("l-erro").textContent = error.mensagem || "E-mail ou senha incorretos."; return; }
  entrar(data.session);
};
$("l-senha").addEventListener("keydown", e => { if (e.key === "Enter") $("l-entrar").click(); });
$("bt-sair").onclick = async () => { await sb.auth.signOut(); location.reload(); };
$("bt-atualizar").onclick = () => carregarVarejo();
sb.auth.getSession().then(({data}) => entrar(data.session));

// ── ABAS: a barra é a mesma em todas as telas de Resultados (public/resultados-abas.js) ──
function rota() {
  const r = (location.hash || "").replace("#", "");
  if (window.FoxAbas) FoxAbas.desenhar();   // barra única de Resultados (resultados-abas.js)
  $("bt-atualizar").style.display = r === "varejo" ? "" : "none";
  if (r === "varejo") return carregarVarejo();
  inicio();
}
window.addEventListener("hashchange", () => perfil && rota());

function inicio() {
  $("sub-top").textContent = "Rede Fox Pneus";
  const nome = (perfil.apelido || (perfil.nome || "").split(" ")[0] || "").trim();
  $("tela").innerHTML = `<p style="font-size:14px;color:var(--fx-tx2,#ccc);margin-bottom:14px">${nome ? "Olá, " + esc(nome) + "! " : ""}Escolha o resultado:</p>
  <div class="cards">
    <a class="card" href="/televendas.html?resultados=1"><div class="ic">💰</div><h2>Resultado Televendas</h2><p>Vendas, metas e ranking das operadoras do televendas.</p></a>
    <a class="card" href="#varejo"><div class="ic">🏪</div><h2>Resultado Varejo · Geral</h2><p>Ranking das lojas no dia e no mês, meta, e os vendedores de cada loja. Atualiza de hora em hora.</p></a>
    <a class="card" href="/atacado"><div class="ic">📦</div><h2>Resultado Atacado</h2><p>Vendas do Atacado por vendedor, com as 3 metas, os últimos 5 dias úteis, pneus e as lojas. No modelo do Televendas.</p></a>
    <div class="card breve"><div class="ic">🚚</div><h2>Resultado Truck</h2><p>Será feito no futuro.</p><span class="selo">em breve</span></div>
  </div>`;
}

// ── VAREJO ──
let V = null, aberta = null, editandoMetas = false;
// Dias úteis do mês (igual ao Televendas): seg a sáb, menos os feriados marcados em ✏️ Metas (domingo nunca conta)
let feriados = new Set(), feriadosEdit = null;
function diasUteis(mesIso) {
  const a = Number(mesIso.slice(0, 4)), m = Number(mesIso.slice(5, 7)), fim = new Date(a, m, 0).getDate(), out = [];
  for (let d = 1; d <= fim; d++) if (new Date(a, m - 1, d).getDay() !== 0 && !feriados.has(d)) out.push(d);
  return out;
}
async function carregarVarejo() {
  $("sub-top").textContent = "Resultado Varejo · Geral";
  $("tela").innerHTML = '<div class="vazio">Carregando…</div>';
  const hoje = hojePVH(), mes = hoje.slice(0, 8) + "01";
  const [l, v, c, m] = await Promise.all([
    sb.from("varejo_lojas").select("*").eq("mes", mes),
    sb.from("varejo_vendedores").select("*").eq("mes", mes),
    sb.from("varejo_conferencia").select("*").eq("mes", mes),
    sb.from("varejo_metas").select("*").eq("mes", mes),
  ]);
  if (l.error) {
    $("tela").innerHTML = `<div class="vazio">${/varejo_lojas|does not exist|schema cache/i.test(l.error.message || "") ? "O Resultado Varejo ainda não está pronto: falta rodar o passo 26 no Supabase. Avise o TI." : "Não consegui carregar: " + esc(l.error.message)}</div>`;
    return;
  }
  const mt = m.data || [];   // feriados ficam junto das metas: loja = "feriado_DD"
  feriados = new Set(mt.filter(x => /^feriado_\d+$/.test(x.loja)).map(x => Number(x.loja.slice(8))));
  const sm = somarHoje(l.data || [], v.data || [], hoje);
  V = {hoje, mes, lojas: sm.lojas, vend: sm.vend, conf: c.data || [], metas: mt.filter(x => !/^feriado_/.test(x.loja))};
  desenharVarejo();
}
// O mês completo (com pneus) é lido às 19h; de dia o robô lê só o "hoje" (decisão do TI, 25/11/2026).
// Por isso o mês na tela = retrato do mês (até o dia dele) + vendido hoje, quando o retrato é de antes de hoje.
function somarHoje(lojas, vend, hoje) {
  const hojeL = Object.fromEntries(lojas.filter(x => x.periodo === "hoje" && x.dia === hoje).map(x => [x.loja, x]));
  const soma = (a, b) => Math.round((Number(a || 0) + Number(b || 0)) * 100) / 100;
  const atrasado = new Set();
  const L = lojas.map(x => {
    const h = hojeL[x.loja];
    if (x.periodo !== "mes" || !h || !(x.dia < hoje)) return x;
    atrasado.add(x.loja);
    const venda = soma(x.venda, h.venda), cli = Number(x.clientes || 0) + Number(h.clientes || 0);
    return {...x, venda, clientes: cli, itens: soma(x.itens, h.itens), ticket: cli ? Math.round(venda / cli * 100) / 100 : 0, somouHoje: true};
  });
  const hojeV = vend.filter(x => x.periodo === "hoje" && x.dia === hoje && atrasado.has(x.loja));
  const V2 = vend.map(x => {

function calFeriados() {

async function salvarMetas() {
  const pn = l => { const v = k => { const e = document.querySelector(`.metas input[data-pn="${k}"][data-l="${l}"]`); return e && e.value !== "" ? Number(e.value) : null; }; return {meta_pneus: v("m"), super_pneus: v("s"), mega_pneus: v("g")}; };

  const { error } = await sb.from("varejo_metas").upsert(linhas, {onConflict: "mes,loja"});
  if (error) { $("metas-msg").textContent = "Não consegui salvar: " + error.message; return; }
  if (feriadosEdit) {   // feriados: apaga os do mês e grava os marcados (loja = "feriado_DD")
    const del = await sb.from("varejo_metas").delete().eq("mes", V.mes).like("loja", "feriado_%");
    if (del.error) { $("metas-msg").textContent = "Não consegui salvar os feriados: " + del.error.message; return; }
    const fer = [...feriadosEdit].map(d => ({mes: V.mes, loja: "feriado_" + String(d).padStart(2, "0"), meta: 0, alterado_por: perfil.nome || perfil.email, alterado_em: new Date().toISOString()}));

}
